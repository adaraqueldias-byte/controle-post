<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atualizando...</title>
</head>
<body style="font-family:sans-serif;background:#1a1a2e;color:#fff;text-align:center;padding-top:35vh;margin:0">
<h2 style="font-weight:700">Atualizando o app... 💚</h2>
<p style="color:#9090b8">Só um instante, já abre sozinho.</p>
<script>
(async function(){
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const r of regs) { try { await r.unregister(); } catch(e){} }
    }
    if (window.caches) {
      const keys = await caches.keys();
      for (const k of keys) { try { await caches.delete(k); } catch(e){} }
    }
  } catch(e){}
  // Seus produtos ficam guardados (localStorage) — nada é apagado.
  setTimeout(function(){ location.replace('../?fresh=' + Date.now()); }, 800);
})();
</script>
</body>
</html>
