<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Garimpo · Ofertas do dia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root { --bg:#0d0d17; --card:#16162a; --linha:#262645; --roxo:#7c3aed; --roxo2:#a855f7; --txt:#e8e8f5; --sub:#8888b0; --verde:#22c55e; }
  body { font-family: system-ui,'Segoe UI',sans-serif; background: var(--bg); color: var(--txt); padding-bottom: 40px; }

  /* CABEÇALHO */
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #141428 0%, rgba(13,13,23,.96) 100%);
    backdrop-filter: blur(8px);
    padding: 14px 16px 12px; border-bottom: 1px solid var(--linha);
  }
  .marca { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--roxo), var(--roxo2));
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    box-shadow: 0 4px 12px rgba(124,58,237,.4);
  }
  .marca h1 { font-size: 19px; font-weight: 800; letter-spacing: .3px; }
  .marca h1 span { color: var(--roxo2); }
  .marca .tag { font-size: 11px; color: var(--sub); margin-top: -2px; }

  .busca-wrap { position: relative; }
  .busca-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity:.5; }
  input.busca {
    width: 100%; background: #20203a; border: 1px solid var(--linha); border-radius: 12px;
    color: var(--txt); font-size: 15px; padding: 11px 12px 11px 38px;
  }
  input.busca::placeholder { color: var(--sub); }

  /* FILTROS (chips) */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; background: #20203a; border: 1px solid var(--linha); color: var(--sub);
    padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .chip.ativo { background: linear-gradient(135deg, var(--roxo), var(--roxo2)); color: #fff; border-color: transparent; }

  /* CONTADOR */
  .info { padding: 10px 16px 4px; font-size: 12px; color: var(--sub); }
  .info b { color: var(--roxo2); }

  /* GRID */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px; }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(3,1fr); } }

  .card {
    background: var(--card); border: 1px solid var(--linha); border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
    transition: transform .1s, border-color .2s;
  }
  .card:active { transform: scale(.98); }
  .foto {
    aspect-ratio: 1; width: 100%; object-fit: cover; background: #20203a;
    display: flex; align-items: center; justify-content: center; font-size: 46px;
  }
  .badge-off {
    position: absolute; top: 9px; left: 9px;
    background: linear-gradient(135deg,#f43f5e,#e11d48); color: #fff;
    font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .badge-loja {
    position: absolute; top: 9px; right: 9px; font-size: 9px; font-weight: 800;
    padding: 3px 7px; border-radius: 8px; text-transform: uppercase; letter-spacing: .3px;
  }
  .loja-shopee { background: #ee4d2d; color: #fff; }
  .loja-ml { background: #ffe600; color: #2d2000; }

  .corpo { padding: 10px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .titulo { font-size: 13px; line-height: 1.3; color: #dcdcf0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 34px; }
  .precos { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .preco { font-size: 17px; font-weight: 800; color: var(--verde); }
  .preco-velho { font-size: 12px; color: var(--sub); text-decoration: line-through; }
  .meta { font-size: 11px; color: var(--sub); display: flex; gap: 8px; }

  .acoes { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
  .btn-ver {
    flex: 1; text-align: center; text-decoration: none;
    background: linear-gradient(135deg, var(--roxo), #9333ea); color: #fff;
    padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 700;
  }
  .btn-share {
    width: 40px; flex-shrink: 0; background: #20203a; border: 1px solid var(--linha);
    border-radius: 10px; color: var(--roxo2); cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .vazio { grid-column: 1/-1; text-align: center; color: var(--sub); padding: 50px 20px; }

  footer { text-align: center; font-size: 11px; color: var(--sub); padding: 20px; }
</style>
</head>
<body>
  <header>
    <div class="marca">
      <div class="logo">💎</div>
      <div>
        <h1>Garimpo<span>.</span></h1>
        <div class="tag">as melhores ofertas do dia, garimpadas pra você</div>
      </div>
    </div>
    <div class="busca-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="busca" id="busca" placeholder="Buscar produto...">
    </div>
  </header>

  <div class="chips" id="chips"></div>
  <div class="info" id="info"></div>
  <div class="grid" id="grid"></div>
  <footer id="rodape">Atualizado automaticamente todo dia 🤖</footer>

<script>
  // Enquanto não há produtos.json (robô ainda não rodou), mostra estes
  // exemplos, só para você ver o visual da vitrine.
  const DEMO = [
    { fonte:'Shopee', emoji:'🎧', titulo:'Fone de Ouvido Bluetooth TWS Pro à prova d\'água', preco:79.90, preco_antigo:159.90, vendas:12400, avaliacao:4.8, link:'#' },
    { fonte:'Mercado Livre', emoji:'⌚', titulo:'Smartwatch D20 Relógio Inteligente Monitor Cardíaco', preco:45.00, preco_antigo:89.90, vendas:8900, avaliacao:4.6, link:'#' },
    { fonte:'Shopee', emoji:'💡', titulo:'Luminária LED de Mesa Articulável 3 Cores Recarregável', preco:34.90, preco_antigo:69.90, vendas:5300, avaliacao:4.9, link:'#' },
    { fonte:'Shopee', emoji:'🍳', titulo:'Kit Organizador de Cozinha Multiuso 6 Peças', preco:59.90, preco_antigo:99.90, vendas:2100, avaliacao:4.7, link:'#' },
    { fonte:'Mercado Livre', emoji:'📱', titulo:'Suporte de Celular Articulado para Mesa e Cama', preco:24.90, preco_antigo:39.90, vendas:15600, avaliacao:4.8, link:'#' },
    { fonte:'Shopee', emoji:'💄', titulo:'Kit Pincéis de Maquiagem Profissional 12 Unidades', preco:29.90, preco_antigo:79.90, vendas:3400, avaliacao:4.5, link:'#' },
    { fonte:'Mercado Livre', emoji:'🧹', titulo:'Rodo Mágico Limpa Vidros com Cabo Extensível', preco:38.00, preco_antigo:65.00, vendas:1800, avaliacao:4.4, link:'#' },
    { fonte:'Shopee', emoji:'☕', titulo:'Caneca Térmica Inox 500ml Mantém Temperatura 12h', preco:42.90, preco_antigo:74.90, vendas:6700, avaliacao:4.9, link:'#' },
  ];

  let TODOS = [];
  let filtroLoja = 'Todas';

  function moeda(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function off(p){ return (p.preco_antigo && p.preco_antigo>p.preco) ? Math.round((1-p.preco/p.preco_antigo)*100) : 0; }

  async function carregar(){
    try {
      const r = await fetch('produtos.json?_='+Date.now());
      if(!r.ok) throw 0;
      const d = await r.json();
      TODOS = (d.produtos||[]).length ? d.produtos : DEMO;
      const usandoDemo = !((d.produtos||[]).length);
      document.getElementById('rodape').textContent = usandoDemo
        ? 'Prévia com produtos de exemplo · o robô preenche automático 🤖'
        : 'Atualizado em ' + new Date(d.gerado_em).toLocaleString('pt-BR') + ' 🤖';
    } catch(e){
      TODOS = DEMO;
      document.getElementById('rodape').textContent = 'Prévia com produtos de exemplo · o robô preenche automático 🤖';
    }
    montarChips();
    render();
  }

  function montarChips(){
    const lojas = ['Todas', ...new Set(TODOS.map(p=>p.fonte))];
    document.getElementById('chips').innerHTML = lojas.map(l=>
      `<div class="chip ${l===filtroLoja?'ativo':''}" data-loja="${l}">${l}</div>`).join('');
    document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
      filtroLoja=c.dataset.loja; montarChips(); render();
    });
  }

  function render(){
    const termo = (document.getElementById('busca').value||'').toLowerCase();
    let lista = TODOS.filter(p=>
      (filtroLoja==='Todas'||p.fonte===filtroLoja) &&
      (!termo || (p.titulo||'').toLowerCase().includes(termo))
    );
    document.getElementById('info').innerHTML = `<b>${lista.length}</b> ofertas encontradas`;

    const grid = document.getElementById('grid');
    if(!lista.length){ grid.innerHTML='<div class="vazio">Nenhuma oferta encontrada 😕</div>'; return; }

    grid.innerHTML = lista.map(p=>{
      const d = off(p);
      const badgeOff = d ? `<div class="badge-off">-${d}%</div>` : '';
      const cls = p.fonte==='Shopee' ? 'loja-shopee' : 'loja-ml';
      const nomeLoja = p.fonte==='Mercado Livre' ? 'ML' : p.fonte;
      const foto = p.foto ? `<img class="foto" src="${p.foto}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'foto',textContent:'🛍️'}))">`
                          : `<div class="foto">${p.emoji||'🛍️'}</div>`;
      const velho = p.preco_antigo ? `<span class="preco-velho">${moeda(p.preco_antigo)}</span>` : '';
      const nota = p.avaliacao ? `⭐ ${p.avaliacao}` : '';
      const vendas = p.vendas ? `🛍️ ${p.vendas>1000?(p.vendas/1000).toFixed(1)+'k':p.vendas}` : '';
      return `
        <div class="card">
          ${badgeOff}<div class="badge-loja ${cls}">${nomeLoja}</div>
          ${foto}
          <div class="corpo">
            <div class="titulo">${p.titulo}</div>
            <div class="precos"><span class="preco">${moeda(p.preco)}</span>${velho}</div>
            <div class="meta"><span>${nota}</span><span>${vendas}</span></div>
            <div class="acoes">
              <a class="btn-ver" href="${p.link}" target="_blank" rel="noopener">Ver oferta</a>
              <button class="btn-share" onclick='compartilhar(${JSON.stringify(p).replace(/'/g,"&#39;")})' title="Compartilhar">↗</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function compartilhar(p){
    const texto = `🔥 ${p.titulo}\n💰 ${moeda(p.preco)}` + (off(p)?` (${off(p)}% OFF)`:'') + `\n👉 ${p.link}`;
    if(navigator.share){ navigator.share({title:p.titulo, text:texto, url:p.link}).catch(()=>{}); }
    else { navigator.clipboard?.writeText(texto); alert('Oferta copiada! É só colar no WhatsApp/Instagram.'); }
  }

  document.getElementById('busca').addEventListener('input', render);
  carregar();

  // Registra o service worker (deixa o app instalável e offline).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
