<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Garimpo · Ofertas do dia</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg:#f6f6f8; --card:#ffffff; --txt:#1c1c22; --sub:#9a9aa8;
    --linha:#ececf1; --roxo:#7c3aed; --verde:#16a34a; --vermelho:#e11d48;
  }
  body { font-family: system-ui,'Segoe UI',sans-serif; background: var(--bg); color: var(--txt); padding-bottom: 48px; }

  /* CABEÇALHO */
  header {
    position: sticky; top: 0; z-index: 10; background: rgba(246,246,248,.9);
    backdrop-filter: blur(12px); padding: 20px 18px 14px;
  }
  .marca h1 { font-size: 24px; font-weight: 800; letter-spacing: -.5px; }
  .marca h1 span { color: var(--roxo); }
  .marca .tag { font-size: 12px; color: var(--sub); margin-top: 2px; font-weight: 500; }

  .busca-wrap { position: relative; margin-top: 16px; }
  .busca-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); }
  input.busca {
    width: 100%; background: #fff; border: 1px solid var(--linha); border-radius: 14px;
    color: var(--txt); font-size: 15px; padding: 13px 14px 13px 42px; outline: none;
    transition: border-color .15s;
  }
  input.busca:focus { border-color: var(--roxo); }
  input.busca::placeholder { color: var(--sub); }

  /* FILTROS (chips) */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 6px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; background: transparent; border: 1px solid var(--linha); color: var(--sub);
    padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .chip.ativo { background: var(--txt); color: #fff; border-color: var(--txt); }

  /* CONTADOR */
  .info { padding: 8px 18px 2px; font-size: 12px; color: var(--sub); font-weight: 500; }

  /* GRID */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 12px 18px; }
  @media (min-width: 620px) { .grid { grid-template-columns: repeat(3,1fr); } }

  .card {
    background: var(--card); border-radius: 18px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
    box-shadow: 0 1px 3px rgba(20,20,40,.05); transition: box-shadow .2s, transform .1s;
  }
  .card:active { transform: scale(.98); }
  .foto-wrap { position: relative; padding: 10px 10px 0; }
  .foto {
    aspect-ratio: 1; width: 100%; object-fit: cover; border-radius: 12px; background: #f2f2f6;
    display: flex; align-items: center; justify-content: center; font-size: 46px;
  }
  .badge-off {
    position: absolute; top: 18px; left: 18px;
    background: var(--vermelho); color: #fff;
    font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 8px;
  }
  .badge-loja {
    position: absolute; top: 18px; right: 18px; font-size: 9px; font-weight: 700;
    padding: 3px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: .3px;
    background: rgba(255,255,255,.92); color: #55555f; box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  .corpo { padding: 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .titulo { font-size: 13px; line-height: 1.35; color: #33333c; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 35px; }
  .precos { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .preco { font-size: 18px; font-weight: 800; color: var(--txt); letter-spacing: -.3px; }
  .preco-velho { font-size: 12px; color: var(--sub); text-decoration: line-through; }
  .meta { font-size: 11px; color: var(--sub); display: flex; gap: 10px; font-weight: 500; }

  .acoes { display: flex; gap: 7px; margin-top: auto; padding-top: 4px; }
  .btn-ver {
    flex: 1; text-align: center; text-decoration: none; background: var(--roxo); color: #fff;
    padding: 10px; border-radius: 11px; font-size: 13px; font-weight: 700;
  }
  .btn-share {
    width: 42px; flex-shrink: 0; background: #f4f4f7; border: none;
    border-radius: 11px; color: #55555f; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .vazio { grid-column: 1/-1; text-align: center; color: var(--sub); padding: 60px 20px; }

  footer { text-align: center; font-size: 11px; color: var(--sub); padding: 24px; font-weight: 500; }
</style>
</head>
<body>
  <header>
    <div class="marca">
      <h1>Garimpo<span>.</span></h1>
      <div class="tag">as melhores ofertas do dia, garimpadas pra você</div>
    </div>
    <div class="busca-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9aa8" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="busca" id="busca" placeholder="Buscar produto...">
    </div>
  </header>

  <div class="chips" id="chips"></div>
  <div class="info" id="info"></div>
  <div class="grid" id="grid"></div>
  <footer id="rodape">Atualizado automaticamente todo dia</footer>

<script>
  // Enquanto não há produtos.json (robô ainda não rodou), mostra estes
  // exemplos, só para você ver o visual da vitrine.
  const DEMO = [
    { fonte:'Shopee', emoji:'🎧', titulo:'Fone de Ouvido Bluetooth TWS Pro à prova d\'água', preco:79.90, preco_antigo:159.90, vendas:12400, avaliacao:4.8, link:'#' },
    { fonte:'Mercado Livre', emoji:'⌚', titulo:'Smartwatch D20 Relógio Inteligente Monitor Cardíaco', preco:45.00, preco_antigo:89.90, vendas:8900, avaliacao:4.6, link:'#' },
    { fonte:'Shopee', emoji:'💡', titulo:'Luminária LED de Mesa Articulável 3 Cores Recarregável', preco:34.90, preco_antigo:69.90, vendas:5300, avaliacao:4.9, link:'#' },
    { fonte:'Shopee', emoji:'🍳', titulo:'Kit Organizador de Cozinha Multiuso 6 Peças', preco:59.90, preco_antigo:99.90, vendas:2100, avaliacao:4.7, link:'#' },
    { fonte:'Mercado Livre', emoji:'📱', titulo:'Suporte de Celular Articulado para Mesa e Cama', preco:24.90, preco_antigo:39.90, vendas:15600, avaliacao:4.8, link:'#' },
    { fonte:'Shopee', emoji:'💄', titulo:'Kit Pincéis de Maquiagem Profissional 12 Unidades', preco:29.90, preco_antigo:79.90, vendas:3400, avaliacao:4.5, link:'#' },
    { fonte:'Mercado Livre', emoji:'🧹', titulo:'Rodo Mágico Limpa Vidros com Cabo Extensível', preco:38.00, preco_antigo:65.00, vendas:1800, avaliacao:4.4, link:'#' },
    { fonte:'Shopee', emoji:'☕', titulo:'Caneca Térmica Inox 500ml Mantém Temperatura 12h', preco:42.90, preco_antigo:74.90, vendas:6700, avaliacao:4.9, link:'#' },
  ];

  let TODOS = [];
  let filtroLoja = 'Todas';

  function moeda(v){ return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
  function off(p){ return (p.preco_antigo && p.preco_antigo>p.preco) ? Math.round((1-p.preco/p.preco_antigo)*100) : 0; }

  async function carregar(){
    try {
      const r = await fetch('produtos.json?_='+Date.now());
      if(!r.ok) throw 0;
      const d = await r.json();
      TODOS = (d.produtos||[]).length ? d.produtos : DEMO;
      const usandoDemo = !((d.produtos||[]).length);
      document.getElementById('rodape').textContent = usandoDemo
        ? 'Prévia com produtos de exemplo · o robô preenche automático'
        : 'Atualizado em ' + new Date(d.gerado_em).toLocaleString('pt-BR');
    } catch(e){
      TODOS = DEMO;
      document.getElementById('rodape').textContent = 'Prévia com produtos de exemplo · o robô preenche automático';
    }
    montarChips();
    render();
  }

  function montarChips(){
    const lojas = ['Todas', ...new Set(TODOS.map(p=>p.fonte))];
    document.getElementById('chips').innerHTML = lojas.map(l=>
      `<div class="chip ${l===filtroLoja?'ativo':''}" data-loja="${l}">${l}</div>`).join('');
    document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{
      filtroLoja=c.dataset.loja; montarChips(); render();
    });
  }

  function render(){
    const termo = (document.getElementById('busca').value||'').toLowerCase();
    let lista = TODOS.filter(p=>
      (filtroLoja==='Todas'||p.fonte===filtroLoja) &&
      (!termo || (p.titulo||'').toLowerCase().includes(termo))
    );
    document.getElementById('info').textContent = `${lista.length} ofertas encontradas`;

    const grid = document.getElementById('grid');
    if(!lista.length){ grid.innerHTML='<div class="vazio">Nenhuma oferta encontrada</div>'; return; }

    grid.innerHTML = lista.map(p=>{
      const d = off(p);
      const badgeOff = d ? `<div class="badge-off">-${d}%</div>` : '';
      const nomeLoja = p.fonte==='Mercado Livre' ? 'ML' : p.fonte;
      const foto = p.foto ? `<img class="foto" src="${p.foto}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'foto',textContent:'🛍️'}))">`
                          : `<div class="foto">${p.emoji||'🛍️'}</div>`;
      const velho = p.preco_antigo ? `<span class="preco-velho">${moeda(p.preco_antigo)}</span>` : '';
      const nota = p.avaliacao ? `⭐ ${p.avaliacao}` : '';
      const vendas = p.vendas ? `${p.vendas>1000?(p.vendas/1000).toFixed(1)+'k':p.vendas} vendas` : '';
      return `
        <div class="card">
          <div class="foto-wrap">
            ${badgeOff}<div class="badge-loja">${nomeLoja}</div>
            ${foto}
          </div>
          <div class="corpo">
            <div class="titulo">${p.titulo}</div>
            <div class="precos"><span class="preco">${moeda(p.preco)}</span>${velho}</div>
            <div class="meta"><span>${nota}</span><span>${vendas}</span></div>
            <div class="acoes">
              <a class="btn-ver" href="${p.link}" target="_blank" rel="noopener">Ver oferta</a>
              <button class="btn-share" onclick='compartilhar(${JSON.stringify(p).replace(/'/g,"&#39;")})' title="Compartilhar">↗</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function compartilhar(p){
    const texto = `🔥 ${p.titulo}\n💰 ${moeda(p.preco)}` + (off(p)?` (${off(p)}% OFF)`:'') + `\n👉 ${p.link}`;
    if(navigator.share){ navigator.share({title:p.titulo, text:texto, url:p.link}).catch(()=>{}); }
    else { navigator.clipboard?.writeText(texto); alert('Oferta copiada! É só colar no WhatsApp/Instagram.'); }
  }

  document.getElementById('busca').addEventListener('input', render);
  carregar();

  // Registra o service worker (deixa o app instalável e offline).
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
