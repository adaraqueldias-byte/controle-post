<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Controle de Post</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d0d17;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 14px 14px 60px;
    max-width: 760px;
    margin: 0 auto;
  }

  /* TÍTULO DO APP */
  .app-titulo {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #a78bfa;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  /* CABEÇALHO / DIA */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 8px 0 14px;
  }
  .btn-dia {
    background: #20203a;
    border: none;
    color: #b0b0d0;
    font-size: 22px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .1s;
    flex-shrink: 0;
  }
  .btn-dia:hover { background: #32325a; }
  .btn-dia:active { transform: scale(.92); }

  .dia-info { text-align: center; min-width: 200px; }
  .dia-nome { font-size: 21px; font-weight: 700; color: #fff; }
  .dia-data { font-size: 13px; color: #7878a8; margin-top: 1px; }
  .badge-hoje {
    display: inline-block;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: #fff; font-size: 10px; font-weight: 700;
    padding: 2px 9px; border-radius: 20px; margin-top: 5px;
    text-transform: uppercase; letter-spacing: .5px;
    cursor: default;
  }
  .badge-voltar-hoje {
    display: inline-block;
    background: #20203a; color: #a78bfa;
    font-size: 10px; font-weight: 700;
    padding: 2px 9px; border-radius: 20px; margin-top: 5px;
    cursor: pointer; border: 1px solid #3a3a5a;
  }

  /* RESUMO DO DIA */
  .resumo {
    text-align: center; font-size: 13px;
    color: #7878a8; margin-bottom: 16px;
  }
  .resumo span { color: #a78bfa; font-weight: 700; }
  .resumo .tudo-ok { color: #22c55e; }

  /* BOTÕES DE AÇÃO */
  .acoes-topo { display: flex; gap: 8px; margin-bottom: 20px; }
  .acoes-topo .btn-imprimir { flex: 1; }
  .btn-add {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    flex: 1; padding: 10px;
    background: linear-gradient(135deg, #7c3aed, #9333ea);
    border: none; border-radius: 10px;
    color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer;
    transition: filter .2s, transform .1s;
    box-shadow: 0 4px 14px rgba(124,58,237,.3);
  }
  .btn-add:hover { filter: brightness(1.1); }
  .btn-add:active { transform: scale(.98); }

  .btn-imprimir {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 10px 12px; background: #20203a;
    border: 1px solid #3a3a5a; border-radius: 10px;
    color: #b0b0d0; font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: background .2s, transform .1s;
  }
  .btn-imprimir:hover { background: #2a2a4a; }
  .btn-imprimir:active { transform: scale(.97); }

  /* MODAL */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.75); z-index: 100;
    align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(3px);
  }
  .overlay.open { display: flex; }
  .modal {
    background: #18182c; border-radius: 18px; padding: 24px;
    width: 100%; max-width: 420px; border: 1px solid #2a2a44;
    animation: pop .18s ease;
    max-height: 90vh; overflow-y: auto;
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { font-size: 18px; margin-bottom: 16px; color: #fff; }
  .modal label { display: block; font-size: 12px; color: #8888b0; margin-bottom: 6px; }
  .modal input, .modal select {
    width: 100%; background: #0d0d17; border: 1px solid #2a2a44;
    border-radius: 10px; color: #e0e0e0; font-size: 13px;
    padding: 10px 12px; margin-bottom: 14px; outline: none;
  }
  .modal input:focus, .modal select:focus { border-color: #7c3aed; }
  .modal select option { background: #18182c; }
  /* SELEÇÃO DE LOCAIS NO MODAL */
  .sel-locais { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .sel-grupo-tit { font-size: 10px; font-weight: 700; color: #5a5a92; text-transform: uppercase; letter-spacing: .6px; margin-top: 4px; }
  .sel-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .sel-chip {
    font-size: 11px; padding: 5px 9px; border-radius: 12px;
    border: 1px solid #2a2a44; background: #0d0d17; color: #6a6a90;
    cursor: pointer; user-select: none; transition: all .15s;
  }
  .sel-chip.on { border-color: #7c3aed; background: #1c1438; color: #c4b5fd; font-weight: 600; }

  .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
  .btn-salvar {
    flex: 1; padding: 13px; background: linear-gradient(135deg,#7c3aed,#9333ea);
    border: none; border-radius: 10px; color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-cancelar {
    flex: 1; padding: 13px; background: #20203a; border: none;
    border-radius: 10px; color: #a0a0c0; font-size: 15px; cursor: pointer;
  }

  /* CARD DE PRODUTO */
  .card {
    background: #18182c; border-radius: 16px; padding: 16px;
    margin-bottom: 12px; border: 1px solid #2a2a44;
    transition: border-color .3s;
  }
  .card.completo {
    border-color: #22c55e;
    background: linear-gradient(180deg, #14241a 0%, #18182c 60%);
  }

  .card-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; gap: 8px;
  }
  .prod-info { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; flex: 1; }

  /* FOTO DO PRODUTO */
  .prod-foto {
    width: 52px; height: 52px; border-radius: 10px;
    object-fit: cover; border: 1px solid #2a2a44; flex-shrink: 0;
  }
  .prod-foto-wrap {
    display: flex; align-items: flex-start; gap: 10px;
    flex: 1; min-width: 0;
  }
  .prod-info-col { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
  .card-data { font-size: 10px; color: #5a5a92; margin-bottom: 8px; }
  .loja-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px;
    border-radius: 20px; white-space: nowrap;
  }
  .loja-shopee       { background: #ee4d2d; color: #fff; }
  .loja-mercadolivre { background: #ffe600; color: #2d3277; }
  .loja-shein        { background: #000; color: #fff; border: 1px solid #444; }
  .loja-amazon       { background: #ff9900; color: #111; }
  .loja-magalu       { background: #0086ff; color: #fff; }

  .prod-num { font-size: 13px; font-weight: 700; color: #5a5a92; margin-right: 2px; }
  .prod-nome { font-size: 16px; font-weight: 600; color: #fff; }
  .selo-completo { font-size: 14px; }

  .card-acoes { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .btn-icone {
    background: none; border: none; color: #55557a;
    font-size: 15px; cursor: pointer; padding: 5px 7px;
    border-radius: 8px; transition: color .2s, background .2s;
  }
  .btn-icone:hover { background: #20203a; }
  .btn-editar:hover { color: #a78bfa; }
  .btn-excluir { font-size: 17px; }
  .btn-excluir:hover { color: #f87171; }

  /* BARRA DE PROGRESSO */
  .progresso-wrap {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .progresso-barra {
    flex: 1; height: 7px; background: #0d0d17;
    border-radius: 10px; overflow: hidden;
  }
  .progresso-fill {
    height: 100%; background: linear-gradient(90deg,#7c3aed,#a855f7);
    border-radius: 10px; transition: width .35s ease;
  }
  .card.completo .progresso-fill { background: linear-gradient(90deg,#16a34a,#22c55e); }
  .progresso-txt {
    font-size: 12px; font-weight: 700; color: #8888b0;
    white-space: nowrap; min-width: 34px; text-align: right;
  }
  .card.completo .progresso-txt { color: #22c55e; }

  /* CANAIS */
  .canais-grupos { display: flex; flex-direction: column; gap: 7px; }
  .grupo-label {
    font-size: 10px; font-weight: 700; color: #5a5a92;
    text-transform: uppercase; letter-spacing: .8px; margin-top: 4px;
  }
  .canais { display: flex; flex-wrap: wrap; gap: 5px; }

  .canal {
    display: flex; align-items: center; gap: 3px;
    padding: 3px 9px; border-radius: 11px;
    border: 1px solid #2a2a44; cursor: pointer;
    transition: all .15s; user-select: none; background: #0d0d17;
  }
  .canal:hover { border-color: #7c3aed; }
  .canal:active { transform: scale(.95); }
  .canal.ok { border-color: #22c55e; background: #0d2818; }

  .canal-nome { font-size: 11px; color: #9090b8; white-space: nowrap; }
  .canal.ok .canal-nome { color: #86efac; font-weight: 600; }
  .check { font-size: 13px; flex-shrink: 0; line-height: 1; color: #22c55e; font-weight: 700; }

  /* AVISO BACKUP */
  .aviso-backup {
    display: flex; align-items: center; justify-content: flex-end; gap: 4px;
    margin-bottom: 8px;
  }
  .aviso-backup .icone-backup {
    background: none; border: 1px solid #f59e0b; border-radius: 8px;
    font-size: 15px; padding: 3px 8px; cursor: pointer; line-height: 1;
  }
  .aviso-backup .fechar-aviso {
    background: none; border: none; color: #555577; font-size: 13px;
    padding: 1px 3px; cursor: pointer; flex-shrink: 0;
  }

  /* VAZIO */
  .vazio { text-align: center; padding: 56px 20px; color: #44446a; }
  .vazio-icone { font-size: 52px; margin-bottom: 14px; }
  .vazio p { font-size: 15px; line-height: 1.5; }

  /* RODAPÉ LIMPO */
  .rodape {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 18px; padding-top: 14px; border-top: 1px solid #20203a;
  }
  .rodape-btn {
    background: transparent; border: none; color: #8888b0;
    font-size: 13px; padding: 6px 10px; cursor: pointer; border-radius: 8px;
  }
  .rodape-btn:hover { background: #18182c; color: #c4b5fd; }
  .painel-mais {
    display: none; flex-direction: column; gap: 6px;
    margin-top: 10px; padding: 10px; background: #14142a;
    border: 1px solid #20203a; border-radius: 10px;
  }
  .painel-mais.aberto { display: flex; }
  .painel-mais button {
    background: transparent; border: 1px solid #2a2a44; border-radius: 8px;
    color: #9090b8; font-size: 13px; padding: 9px; cursor: pointer;
  }
  .painel-mais button:hover { background: #18182c; color: #c4b5fd; }

  /* BOTÕES MINI (backup / salvos) */
  .acoes-mini { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .acoes-mini button {
    flex: 1; min-width: 90px; padding: 8px 6px;
    background: transparent; border: 1px solid #2a2a44;
    border-radius: 8px; color: #8888b0; font-size: 12px;
    cursor: pointer; transition: background .2s;
  }
  .acoes-mini button:hover { background: #18182c; color: #b0b0d0; }

  /* TELA DE RELATÓRIO */
  .rel-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: #0d0d17; overflow-y: auto; padding: 14px;
  }
  .rel-overlay.open { display: block; }
  .rel-topo {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .rel-topo-acoes { display: flex; gap: 8px; }
  .rel-btn-voltar {
    background: #20203a; border: none; border-radius: 8px;
    color: #b0b0d0; font-size: 14px; padding: 9px 14px; cursor: pointer;
  }
  .rel-btn-salvar, .rel-btn-pdf {
    border: none; border-radius: 8px; font-size: 13px; font-weight: 600;
    padding: 9px 12px; cursor: pointer; color: #fff;
  }
  .rel-btn-salvar { background: #16a34a; }
  .rel-btn-pdf { background: #7c3aed; }
  .rel-folha {
    background: #fff; color: #111; border-radius: 10px;
    padding: 20px; max-width: 760px; margin: 0 auto;
  }
  .rel-folha h1 { font-size: 19px; margin: 0 0 2px; color: #4c1d95; }
  .rel-folha .rsub { font-size: 13px; color: #555; margin-bottom: 6px; }
  .rel-folha .resumo-rel { font-size: 13px; color: #6d28d9; font-weight: bold; margin-bottom: 14px; }
  .rel-folha table { border-collapse: collapse; width: 100%; font-size: 11px; }
  .rel-folha th, .rel-folha td { border: 1px solid #bbb; padding: 5px 6px; text-align: center; }
  .rel-folha th { background: #6d28d9; color: #fff; font-size: 10px; }
  .rel-folha th.loja, .rel-folha th.prod, .rel-folha td.loja, .rel-folha td.prod { text-align: left; }
  .rel-folha td.loja { font-weight: bold; white-space: nowrap; }
  .rel-folha td.prod { min-width: 120px; }
  .rel-folha .cel { color: #16a34a; font-weight: bold; font-size: 13px; }
  .rel-folha .cel-ok { color: #16a34a; font-weight: bold; font-size: 14px; }
  .rel-folha .cel-falta { color: #dc2626; font-weight: bold; font-size: 14px; background: #fee2e2; }
  .rel-folha .cel-na { color: #bbb; font-size: 12px; }
  .rel-legenda { font-size: 11px; color: #555; margin-bottom: 10px; }
  .rel-legenda b { font-weight: bold; }
  .rel-folha tr:nth-child(even) td { background: #f3f0fb; }
  .rel-folha .tab-sem td.dia { text-align: left; font-weight: bold; }
  .rel-folha .data-min { font-weight: normal; color: #888; font-size: 10px; }
  .rel-folha tr.total td { background: #ede9fe; font-weight: bold; }
  .rel-folha .lista-salvos { display: flex; flex-direction: column; gap: 8px; }
  .rel-folha .item-salvo {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 13px;
  }
  .rel-folha .acoes-salvo { display: flex; gap: 6px; flex-shrink: 0; }
  .rel-folha .acoes-salvo button {
    border: none; border-radius: 6px; padding: 6px 10px; font-size: 12px;
    cursor: pointer; background: #6d28d9; color: #fff;
  }
  .rel-folha .acoes-salvo button.del { background: #dc2626; }

  @media print {
    body * { visibility: hidden; }
    .rel-overlay, .rel-overlay * { visibility: visible; }
    .rel-overlay { position: absolute; inset: 0; padding: 0; background: #fff; }
    .no-print { display: none !important; }
    .rel-folha { box-shadow: none; border-radius: 0; }
  }
</style>
</head>
<body>

<div class="app-titulo">Controle de Post</div>

<div class="header">
  <button class="btn-dia" onclick="mudarDia(-1)">‹</button>
  <div class="dia-info">
    <div class="dia-nome" id="dia-nome"></div>
    <div class="dia-data" id="dia-data"></div>
    <div id="badge-hoje"></div>
  </div>
  <button class="btn-dia" onclick="mudarDia(1)">›</button>
</div>

<div id="aviso-backup-wrap"></div>

<button class="btn-add" onclick="abrirModal()" style="width:100%;margin-bottom:14px">＋ Adicionar produto</button>

<div id="lista"></div>

<div class="rodape">
  <button class="rodape-btn" onclick="relatorioDia()">Relatório do dia</button>
  <button class="rodape-btn" onclick="fazerBackup()">💾 Backup</button>
  <button class="rodape-btn" onclick="toggleMais()">⋯ Mais</button>
</div>
<div id="painel-mais" class="painel-mais">
  <button onclick="relatorioSemana()">Relatório da semana</button>
  <button onclick="verRelatoriosSalvos()">Relatórios salvos</button>
  <button onclick="document.getElementById('inp-restaurar').click()">Restaurar backup</button>
  <input type="file" id="inp-restaurar" accept=".json" style="display:none" onchange="restaurarBackup(this)">
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-titulo">Novo produto</h3>
    <label>Nome do produto</label>
    <input type="text" id="inp-nome" placeholder="Ex: Meia calça preta" autocomplete="off">
    <label>Loja de origem</label>
    <select id="inp-loja">
      <option value="">Selecione a loja</option>
      <option value="shopee">Shopee</option>
      <option value="mercadolivre">Mercado Livre</option>
      <option value="shein">Shein</option>
      <option value="amazon">Amazon</option>
      <option value="magalu">Magalu</option>
    </select>
    <label>Foto do produto (opcional)</label>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <img id="preview-foto" src="" alt="" style="display:none;width:60px;height:60px;border-radius:8px;object-fit:cover;border:1px solid #2a2a44">
      <div style="flex:1">
        <button type="button" onclick="document.getElementById('inp-foto').click()" style="width:100%;padding:10px;background:#0d0d17;border:1px dashed #3a3a5a;border-radius:10px;color:#8888b0;font-size:13px;cursor:pointer">📷 Escolher foto</button>
        <input type="file" id="inp-foto" accept="image/*" style="display:none" onchange="previewFoto(this)">
        <button type="button" id="btn-remover-foto" onclick="removerFoto()" style="display:none;width:100%;margin-top:4px;padding:6px;background:none;border:none;color:#f87171;font-size:12px;cursor:pointer">✕ Remover foto</button>
      </div>
    </div>
    <label>Onde vou postar? <span style="color:#5a5a92">(desmarque o que não usar)</span></label>
    <div id="sel-locais" class="sel-locais"></div>
    <div class="modal-btns">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" id="btn-salvar" onclick="salvarProduto()">Adicionar</button>
    </div>
  </div>
</div>

<!-- TELA DE RELATÓRIO -->
<div class="rel-overlay" id="rel-overlay">
  <div class="rel-topo no-print">
    <button class="rel-btn-voltar" onclick="fecharRelatorio()">← Voltar</button>
    <div class="rel-topo-acoes">
      <button class="rel-btn-salvar" onclick="salvarRelatorioAqui()">💾 Salvar aqui</button>
      <button class="rel-btn-pdf" onclick="salvarRelatorioPDF()">🖨️ Salvar em PDF</button>
    </div>
  </div>
  <input type="hidden" id="rel-titulo-salvo">
  <div class="rel-folha" id="rel-corpo"></div>
</div>

<script>
const PASSOS_LOJA = {
  shopee:        { id: 'vitrine',           nome: 'Vitrine afiliado' },
  mercadolivre:  { id: 'meus_links',        nome: 'Meus Links ML' },
  amazon:        { id: 'meus_links_amazon', nome: 'Meus Links Amazon' },
};

const CANAIS = [
  { id: 'canal_whats',    nome: 'WhatsApp',     grupo: 'Canais' },
  { id: 'canal_telegram', nome: 'Telegram',     grupo: 'Canais' },
  { id: 'story_whats',    nome: 'Status (Zap)', grupo: 'Story' },
  { id: 'story_insta',    nome: 'Instagram',    grupo: 'Story' },
  { id: 'story_face',     nome: 'Facebook',     grupo: 'Story' },
  { id: 'feed_insta',     nome: 'Instagram',    grupo: 'Post Carrossel' },
  { id: 'feed_face',      nome: 'Facebook',     grupo: 'Post Carrossel' },
  { id: 'reels_insta',    nome: 'Instagram',    grupo: 'Reels' },
  { id: 'reels_face',     nome: 'Facebook',     grupo: 'Reels' },
  { id: 'yt_shorts',      nome: 'Shorts',       grupo: 'YouTube' },
  { id: 'yt_video',       nome: 'Vídeo',        grupo: 'YouTube' },
  { id: 'tiktok',         nome: 'TikTok',       grupo: 'TikTok' },
  { id: 'tiktok_shop',    nome: 'TikTok Shop',  grupo: 'TikTok' },
];

const LOJAS = {
  shopee: 'Shopee', mercadolivre: 'Mercado Livre', shein: 'Shein',
  amazon: 'Amazon', magalu: 'Magalu',
};

const DIAS_SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

let offsetDia = 0;
let editandoIndex = null;

function diaAtual() {
  const d = new Date();
  d.setDate(d.getDate() + offsetDia);
  d.setHours(0,0,0,0);
  return d;
}
function chave(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function carregar(k) { return JSON.parse(localStorage.getItem('post_' + k) || '[]'); }
function salvar(k, dados) {
  try {
    localStorage.setItem('post_' + k, JSON.stringify(dados));
  } catch(e) {
    alert('⚠️ Memória cheia! Faça um backup agora e remova fotos de produtos antigos para liberar espaço.');
  }
}

const SHOPEE_VIDEO = { id: 'shopee_video', nome: 'Shopee Vídeo', grupo: '' };

function todosItens(loja) {
  const passo = PASSOS_LOJA[loja];
  const base = passo ? [passo, ...CANAIS] : [...CANAIS];
  return loja === 'shopee' ? [...base, SHOPEE_VIDEO] : base;
}
// Itens que o produto realmente vai usar (se não tiver "usar", conta todos — produtos antigos)
function itensDoProduto(p) {
  const loja = (typeof p === 'string') ? p : p.loja;
  const todos = todosItens(loja);
  if (typeof p === 'string' || !p.usar) return todos;
  return todos.filter(c => p.usar[c.id]);
}

function renderDia() {
  const d = diaAtual();
  const k = chave(d);
  const dados = carregar(k);

  document.getElementById('dia-nome').textContent = DIAS_SEMANA[d.getDay()];
  document.getElementById('dia-data').textContent =
    d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();

  const bh = document.getElementById('badge-hoje');
  if (offsetDia === 0) bh.innerHTML = '<span class="badge-hoje">Hoje</span>';
  else bh.innerHTML = '<span class="badge-voltar-hoje" onclick="voltarHoje()">↩ Voltar para hoje</span>';

  // Lista
  const lista = document.getElementById('lista');
  if (total === 0) {
    lista.innerHTML = `<div class="vazio">
      <div class="vazio-icone">🛍️</div>
      <p>Nenhum produto ainda.<br>Toque em <b>"+ Adicionar produto"</b> para começar.</p>
    </div>`;
    return;
  }

  lista.innerHTML = dados.map((p, i) => {
    const num = i + 1;
    const itens = itensDoProduto(p);
    const marcados = itens.filter(c => p.canais && p.canais[c.id]).length;
    const pct = itens.length ? Math.round(marcados / itens.length * 100) : 0;
    const completo = itens.length > 0 && marcados === itens.length;

    let canaisHtml = '';
    let grupoAtual = '\0'; // valor impossível para forçar abertura inicial
    itens.forEach(c => {
      const g = c.grupo || '';
      if (g !== grupoAtual) {
        if (grupoAtual !== '\0') canaisHtml += '</div>';
        if (g) canaisHtml += `<div class="grupo-label">${g}</div>`;
        canaisHtml += '<div class="canais">';
        grupoAtual = g;
      }
      const ok = p.canais && p.canais[c.id];
      canaisHtml += `<div class="canal${ok?' ok':''}" onclick="toggle('${k}',${i},'${c.id}')">
        <span class="canal-nome">${c.nome}</span>
        ${ok?'<span class="check">✓</span>':''}
      </div>`;
    });
    if (grupoAtual !== '\0') canaisHtml += '</div>';

    return `
    <div class="card${completo?' completo':''}">
      <div class="card-top">
        <div class="prod-foto-wrap">
          ${p.foto ? `<img class="prod-foto" src="${p.foto}" alt="">` : ''}
          <div class="prod-info-col">
            <div class="prod-info">
              <span class="prod-num">${num}.</span>
              <span class="loja-badge loja-${p.loja}">${LOJAS[p.loja]||p.loja}</span>
              ${completo?'<span class="selo-completo">✅</span>':''}
            </div>
            <span class="prod-nome">${escapar(p.nome)}</span>
          </div>
        </div>
        <div class="card-acoes">
          <button class="btn-icone btn-editar" onclick="abrirModal('${k}',${i})" title="Editar">✏️</button>
          <button class="btn-icone btn-excluir" onclick="excluir('${k}',${i})" title="Excluir">🗑️</button>
        </div>
      </div>
      <div class="progresso-wrap">
        <div class="progresso-barra"><div class="progresso-fill" style="width:${pct}%"></div></div>
        <span class="progresso-txt">${marcados}/${itens.length}</span>
      </div>
      <div class="canais-grupos">${canaisHtml}</div>
    </div>`;
  }).join('');
}

function escapar(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function mudarDia(d) { offsetDia += d; renderDia(); }
function voltarHoje() { offsetDia = 0; renderDia(); }
function toggleMais() { document.getElementById('painel-mais').classList.toggle('aberto'); }

function toggle(k, i, canalId) {
  const dados = carregar(k);
  if (!dados[i].canais) dados[i].canais = {};
  dados[i].canais[canalId] = !dados[i].canais[canalId];
  salvar(k, dados);
  renderDia();
}

function excluir(k, i) {
  const dados = carregar(k);
  if (!confirm('Excluir "' + dados[i].nome + '"?')) return;
  dados.splice(i, 1);
  salvar(k, dados);
  renderDia();
}

let fotoBase64 = null;
let fotoAlterada = false;

function previewFoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    // Comprime a imagem para caber no localStorage sem sumir
    const imgEl = new Image();
    imgEl.onload = () => {
      const MAX = 400;
      let w = imgEl.width, h = imgEl.height;
      if (w > MAX || h > MAX) {
        if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(imgEl, 0, 0, w, h);
      fotoBase64 = canvas.toDataURL('image/jpeg', 0.7);
      fotoAlterada = true;
      const prev = document.getElementById('preview-foto');
      prev.src = fotoBase64;
      prev.style.display = 'block';
      document.getElementById('btn-remover-foto').style.display = 'block';
    };
    imgEl.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function removerFoto() {
  fotoBase64 = null;
  fotoAlterada = true;
  document.getElementById('preview-foto').style.display = 'none';
  document.getElementById('preview-foto').src = '';
  document.getElementById('btn-remover-foto').style.display = 'none';
  document.getElementById('inp-foto').value = '';
}

// Seleção de locais (quais o produto vai usar)
let selUsar = {};

function montarSelLocais(loja, usarObj) {
  const itens = todosItens(loja);
  // Se não vier seleção (produto novo ou antigo), marca todos
  selUsar = {};
  itens.forEach(c => { selUsar[c.id] = usarObj ? !!usarObj[c.id] : true; });

  const cont = document.getElementById('sel-locais');
  let html = '';
  let grupoAtual = '\0';
  itens.forEach(c => {
    const g = c.grupo || (c.id === 'shopee_video' ? 'Shopee' : (PASSOS_LOJA[loja] && c.id === PASSOS_LOJA[loja].id ? '1º passo' : ''));
    if (g !== grupoAtual) {
      if (grupoAtual !== '\0') html += '</div>';
      if (g) html += `<div class="sel-grupo-tit">${g}</div>`;
      html += '<div class="sel-chips">';
      grupoAtual = g;
    }
    html += `<span class="sel-chip${selUsar[c.id]?' on':''}" data-id="${c.id}" onclick="toggleSel('${c.id}',this)">${c.nome}</span>`;
  });
  if (grupoAtual !== '\0') html += '</div>';
  cont.innerHTML = html;
}

function toggleSel(id, el) {
  selUsar[id] = !selUsar[id];
  el.classList.toggle('on', selUsar[id]);
}

function abrirModal(k, i) {
  editandoIndex = (i !== undefined) ? i : null;
  fotoBase64 = null;
  fotoAlterada = false;
  removerFoto();
  fotoAlterada = false; // reset após removerFoto()
  if (editandoIndex !== null) {
    const dados = carregar(k);
    document.getElementById('inp-nome').value = dados[i].nome;
    document.getElementById('inp-loja').value = dados[i].loja;
    if (dados[i].foto) {
      fotoBase64 = dados[i].foto;
      const img = document.getElementById('preview-foto');
      img.src = fotoBase64;
      img.style.display = 'block';
      document.getElementById('btn-remover-foto').style.display = 'block';
    }
    montarSelLocais(dados[i].loja, dados[i].usar);
    document.getElementById('modal-titulo').textContent = 'Editar produto';
    document.getElementById('btn-salvar').textContent = 'Salvar';
  } else {
    document.getElementById('inp-nome').value = '';
    document.getElementById('inp-loja').value = '';
    montarSelLocais('', null);
    document.getElementById('modal-titulo').textContent = 'Novo produto';
    document.getElementById('btn-salvar').textContent = 'Adicionar';
  }
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('inp-nome').focus(), 100);
}

function fecharModal() {
  editandoIndex = null;
  document.getElementById('overlay').classList.remove('open');
}

function salvarProduto() {
  const nome = document.getElementById('inp-nome').value.trim();
  const loja = document.getElementById('inp-loja').value;
  if (!nome) { document.getElementById('inp-nome').focus(); return; }
  if (!loja) { document.getElementById('inp-loja').focus(); return; }
  // Monta a lista de locais escolhidos para esta loja
  const usar = {};
  let qtdSel = 0;
  todosItens(loja).forEach(c => { if (selUsar[c.id]) { usar[c.id] = true; qtdSel++; } });
  if (qtdSel === 0) { alert('Escolha pelo menos um local para postar.'); return; }

  const k = chave(diaAtual());
  const dados = carregar(k);
  if (editandoIndex !== null) {
    dados[editandoIndex].nome = nome;
    dados[editandoIndex].loja = loja;
    dados[editandoIndex].usar = usar;
    if (fotoAlterada) dados[editandoIndex].foto = fotoBase64 || undefined;
  } else {
    dados.push({ nome, loja, usar, foto: fotoBase64 || undefined, canais: {} });
  }
  salvar(k, dados);
  fecharModal();
  renderDia();
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});
document.getElementById('inp-nome').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('inp-loja').focus();
});
document.getElementById('inp-loja').addEventListener('change', function() {
  // Mantém as escolhas dos canais; o novo 1º passo vem marcado
  const passo = PASSOS_LOJA[this.value];
  if (passo) selUsar[passo.id] = true;
  montarSelLocais(this.value, selUsar);
});

// ============ RELATÓRIOS ============
function statsDia(dados) {
  let feitos = 0, possiveis = 0, completos = 0;
  dados.forEach(p => {
    const itens = itensDoProduto(p);
    const m = itens.filter(c => p.canais && p.canais[c.id]).length;
    feitos += m; possiveis += itens.length;
    if (itens.length > 0 && m === itens.length) completos++;
  });
  return { produtos: dados.length, feitos, possiveis, completos };
}

// Relatório do DIA (tabela tipo o documento original)
function relatorioDia() {
  const d = diaAtual();
  const dados = carregar(chave(d));
  if (dados.length === 0) { alert('Nenhum produto neste dia para gerar relatório.'); return; }
  const dataTxt = DIAS_SEMANA[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
  const colunas = ['1º passo', ...CANAIS.map(c => c.grupo ? c.grupo + ' ' + c.nome : c.nome)];

  // ✔ verde = postado · ✗ vermelho = falta postar · — cinza = não usa neste produto
  const celula = (id, usados, can) => {
    if (!usados.has(id)) return '<td class="cel-na">—</td>';
    return can[id] ? '<td class="cel-ok">✔</td>' : '<td class="cel-falta">✗</td>';
  };
  let linhas = '';
  dados.forEach(p => {
    const passo = PASSOS_LOJA[p.loja];
    const can = p.canais || {};
    const usados = new Set(itensDoProduto(p).map(c => c.id));
    let tds = celula(passo ? passo.id : '__', usados, can);
    CANAIS.forEach(c => { tds += celula(c.id, usados, can); });
    linhas += `<tr><td class="loja">${LOJAS[p.loja]||p.loja}</td><td class="prod">${escapar(p.nome)}</td>${tds}</tr>`;
  });
  const thead = '<th class="loja">Loja</th><th class="prod">Produto</th>' + colunas.map(c => `<th>${c}</th>`).join('');
  const s = statsDia(dados);

  const corpo = `<h1>Relatório do dia</h1>
    <div class="rsub">${dataTxt}</div>
    <div class="resumo-rel">${s.produtos} produtos · ${s.feitos}/${s.possiveis} postagens · ${s.completos} concluídos</div>
    <div class="rel-legenda"><b style="color:#16a34a">✔ postado</b> &nbsp; <b style="color:#dc2626">✗ falta postar</b> &nbsp; <b style="color:#bbb">— não usa</b></div>
    <table><thead><tr>${thead}</tr></thead><tbody>${linhas}</tbody></table>`;
  abrirRelatorio('Relatório do dia — ' + dataTxt, corpo);
}

// Relatório da SEMANA (segunda a domingo do dia exibido)
function relatorioSemana() {
  const base = diaAtual();
  // segunda-feira da semana
  const ini = new Date(base);
  const dow = (ini.getDay() + 6) % 7; // 0 = segunda
  ini.setDate(ini.getDate() - dow);
  const fim = new Date(ini); fim.setDate(ini.getDate() + 6);
  const fmt = x => x.getDate() + '/' + (x.getMonth()+1);
  const periodo = fmt(ini) + ' a ' + fmt(fim) + '/' + fim.getFullYear();

  let linhas = '', totProd=0, totFeitos=0, totPoss=0, totCompl=0, temAlgo=false;
  for (let i=0;i<7;i++){
    const d = new Date(ini); d.setDate(ini.getDate()+i);
    const dados = carregar(chave(d));
    const s = statsDia(dados);
    if (s.produtos>0) temAlgo=true;
    totProd+=s.produtos; totFeitos+=s.feitos; totPoss+=s.possiveis; totCompl+=s.completos;
    const pct = s.possiveis? Math.round(s.feitos/s.possiveis*100):0;
    linhas += `<tr>
      <td class="dia">${DIAS_SEMANA[d.getDay()].replace('-feira','')}<br><span class="data-min">${fmt(d)}</span></td>
      <td>${s.produtos||'-'}</td>
      <td>${s.produtos? s.feitos+'/'+s.possiveis : '-'}</td>
      <td>${s.produtos? pct+'%':'-'}</td>
      <td class="cel">${s.completos||'-'}</td>
    </tr>`;
  }
  if (!temAlgo){ alert('Nenhum produto registrado nesta semana.'); return; }
  const pctTot = totPoss? Math.round(totFeitos/totPoss*100):0;
  linhas += `<tr class="total"><td>TOTAL</td><td>${totProd}</td><td>${totFeitos}/${totPoss}</td><td>${pctTot}%</td><td>${totCompl}</td></tr>`;

  const corpo = `<h1>Relatório da semana</h1>
    <div class="rsub">${periodo}</div>
    <div class="resumo-rel">${totProd} produtos na semana · ${totFeitos}/${totPoss} postagens · ${totCompl} concluídos</div>
    <table class="tab-sem">
      <thead><tr><th>Dia</th><th>Produtos</th><th>Postagens</th><th>%</th><th>Concluídos</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>`;
  abrirRelatorio('Relatório da semana — ' + periodo, corpo);
}

// Abre o relatório numa tela dentro do app (com botões Salvar aqui / PDF)
function abrirRelatorio(titulo, corpoHtml) {
  document.getElementById('rel-titulo-salvo').value = titulo;
  document.getElementById('rel-corpo').innerHTML = corpoHtml;
  document.getElementById('rel-overlay').classList.add('open');
}
function fecharRelatorio() {
  document.getElementById('rel-overlay').classList.remove('open');
}
function salvarRelatorioPDF() { window.print(); }

function salvarRelatorioAqui() {
  const titulo = document.getElementById('rel-titulo-salvo').value;
  const html = document.getElementById('rel-corpo').innerHTML;
  const lista = JSON.parse(localStorage.getItem('relatorios_salvos') || '[]');
  lista.unshift({ titulo, html, em: Date.now() });
  localStorage.setItem('relatorios_salvos', JSON.stringify(lista));
  alert('✅ Relatório salvo no app! Veja em "Relatórios salvos".');
}

function verRelatoriosSalvos() {
  const lista = JSON.parse(localStorage.getItem('relatorios_salvos') || '[]');
  if (lista.length === 0) { alert('Você ainda não salvou nenhum relatório.'); return; }
  let html = '<h1>Relatórios salvos</h1><div class="lista-salvos">';
  lista.forEach((r, i) => {
    const dt = new Date(r.em);
    html += `<div class="item-salvo">
      <span>${escapar(r.titulo)}</span>
      <span class="acoes-salvo">
        <button onclick="abrirSalvo(${i})">Abrir</button>
        <button onclick="excluirSalvo(${i})" class="del">Excluir</button>
      </span>
    </div>`;
  });
  html += '</div>';
  document.getElementById('rel-titulo-salvo').value = 'Relatórios salvos';
  document.getElementById('rel-corpo').innerHTML = html;
  document.getElementById('rel-overlay').classList.add('open');
}
function abrirSalvo(i) {
  const lista = JSON.parse(localStorage.getItem('relatorios_salvos') || '[]');
  if (lista[i]) abrirRelatorio(lista[i].titulo, lista[i].html);
}
function excluirSalvo(i) {
  const lista = JSON.parse(localStorage.getItem('relatorios_salvos') || '[]');
  lista.splice(i,1);
  localStorage.setItem('relatorios_salvos', JSON.stringify(lista));
  verRelatoriosSalvos();
}

// ============ BACKUP / RESTAURAR (segurança contra perda) ============
function fazerBackup() {
  const tudo = {};
  for (let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if (k.startsWith('post_') || k === 'relatorios_salvos') tudo[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(tudo)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const hoje = new Date();
  const nome = 'backup-postagens-' + hoje.getFullYear() + '-' + String(hoje.getMonth()+1).padStart(2,'0') + '-' + String(hoje.getDate()).padStart(2,'0') + '.json';
  const a = document.createElement('a');
  a.href = url; a.download = nome; a.click();
  URL.revokeObjectURL(url);
  alert('💾 Backup salvo no seu aparelho: ' + nome + '\nGuarde esse arquivo em local seguro.');
}
function restaurarBackup(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const tudo = JSON.parse(e.target.result);
      if (!confirm('Restaurar este backup? Os dados atuais serão substituídos pelos do arquivo.')) return;
      Object.keys(tudo).forEach(k => localStorage.setItem(k, tudo[k]));
      alert('✅ Backup restaurado com sucesso!');
      renderDia();
    } catch(err) { alert('Arquivo inválido. Use um backup gerado por este app.'); }
  };
  reader.readAsText(file);
  input.value = '';
}

function verificarAvisoBackup() {
  const hoje = new Date().toISOString().slice(0,10);
  const ultima = localStorage.getItem('backup_aviso_dia');
  const wrap = document.getElementById('aviso-backup-wrap');
  // Só mostra se houver dados e ainda não avisou hoje
  const temDados = Object.keys(localStorage).some(k => k.startsWith('post_'));
  if (!temDados || ultima === hoje) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `<div class="aviso-backup">
    <button class="icone-backup" onclick="fazerBackupAviso()" title="Fazer backup do dia">💾</button>
    <button class="fechar-aviso" onclick="fecharAvisoBackup()">✕</button>
  </div>`;
}

function fecharAvisoBackup() {
  const hoje = new Date().toISOString().slice(0,10);
  localStorage.setItem('backup_aviso_dia', hoje);
  document.getElementById('aviso-backup-wrap').innerHTML = '';
}

function fazerBackupAviso() {
  fecharAvisoBackup();
  fazerBackup();
}

renderDia();
verificarAvisoBackup();
