<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Controle de Post</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c3aed">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d0d17;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 14px 14px 60px;
    max-width: 760px;
    margin: 0 auto;
  }

  /* TÍTULO DO APP */
  .app-titulo {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #a78bfa;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  /* CABEÇALHO / DIA */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 8px 0 14px;
  }
  .btn-dia {
    background: #20203a;
    border: none;
    color: #b0b0d0;
    font-size: 22px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .1s;
    flex-shrink: 0;
  }
  .btn-dia:hover { background: #32325a; }
  .btn-dia:active { transform: scale(.92); }

  .dia-info { text-align: center; min-width: 200px; }
  .dia-nome { font-size: 21px; font-weight: 700; color: #fff; }
  .dia-data { font-size: 13px; color: #7878a8; margin-top: 1px; }
  .badge-hoje {
    display: inline-block;
    background: linear-gradient(135deg, #7c3aed, #a855f7);
    color: #fff; font-size: 10px; font-weight: 700;
    padding: 2px 9px; border-radius: 20px; margin-top: 5px;
    text-transform: uppercase; letter-spacing: .5px;
    cursor: default;
  }
  .badge-voltar-hoje {
    display: inline-block;
    background: #20203a; color: #a78bfa;
    font-size: 10px; font-weight: 700;
    padding: 2px 9px; border-radius: 20px; margin-top: 5px;
    cursor: pointer; border: 1px solid #3a3a5a;
  }

  /* RESUMO DO DIA */
  .resumo {
    text-align: center; font-size: 13px;
    color: #7878a8; margin-bottom: 16px;
  }
  .resumo span { color: #a78bfa; font-weight: 700; }
  .resumo .tudo-ok { color: #22c55e; }

  /* BOTÕES DE AÇÃO */
  .acoes-topo { display: flex; gap: 8px; margin-bottom: 20px; }
  .btn-add {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    flex: 1; padding: 10px;
    background: linear-gradient(135deg, #7c3aed, #9333ea);
    border: none; border-radius: 10px;
    color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer;
    transition: filter .2s, transform .1s;
    box-shadow: 0 4px 14px rgba(124,58,237,.3);
  }
  .btn-add:hover { filter: brightness(1.1); }
  .btn-add:active { transform: scale(.98); }

  .btn-imprimir {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 10px 12px; background: #20203a;
    border: 1px solid #3a3a5a; border-radius: 10px;
    color: #b0b0d0; font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
    transition: background .2s, transform .1s;
  }
  .btn-imprimir:hover { background: #2a2a4a; }
  .btn-imprimir:active { transform: scale(.97); }

  /* MODAL */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.75); z-index: 100;
    align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(3px);
  }
  .overlay.open { display: flex; }
  .modal {
    background: #18182c; border-radius: 18px; padding: 24px;
    width: 100%; max-width: 420px; border: 1px solid #2a2a44;
    animation: pop .18s ease;
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { font-size: 18px; margin-bottom: 16px; color: #fff; }
  .modal label { display: block; font-size: 12px; color: #8888b0; margin-bottom: 6px; }
  .modal input, .modal select {
    width: 100%; background: #0d0d17; border: 1px solid #2a2a44;
    border-radius: 10px; color: #e0e0e0; font-size: 15px;
    padding: 12px 14px; margin-bottom: 14px; outline: none;
  }
  .modal input:focus, .modal select:focus { border-color: #7c3aed; }
  .modal select option { background: #18182c; }
  .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
  .btn-salvar {
    flex: 1; padding: 13px; background: linear-gradient(135deg,#7c3aed,#9333ea);
    border: none; border-radius: 10px; color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-cancelar {
    flex: 1; padding: 13px; background: #20203a; border: none;
    border-radius: 10px; color: #a0a0c0; font-size: 15px; cursor: pointer;
  }

  /* CARD DE PRODUTO */
  .card {
    background: #18182c; border-radius: 16px; padding: 16px;
    margin-bottom: 12px; border: 1px solid #2a2a44;
    transition: border-color .3s;
  }
  .card.completo {
    border-color: #22c55e;
    background: linear-gradient(180deg, #14241a 0%, #18182c 60%);
  }

  .card-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; gap: 8px;
  }
  .prod-info { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; }
  .loja-badge {
    font-size: 11px; font-weight: 700; padding: 3px 10px;
    border-radius: 20px; white-space: nowrap;
  }
  .loja-shopee       { background: #ee4d2d; color: #fff; }
  .loja-mercadolivre { background: #ffe600; color: #2d3277; }
  .loja-shein        { background: #000; color: #fff; border: 1px solid #444; }
  .loja-amazon       { background: #ff9900; color: #111; }
  .loja-magalu       { background: #0086ff; color: #fff; }

  .prod-nome { font-size: 16px; font-weight: 600; color: #fff; }
  .selo-completo { font-size: 14px; }

  .card-acoes { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .btn-icone {
    background: none; border: none; color: #55557a;
    font-size: 15px; cursor: pointer; padding: 5px 7px;
    border-radius: 8px; transition: color .2s, background .2s;
  }
  .btn-icone:hover { background: #20203a; }
  .btn-editar:hover { color: #a78bfa; }
  .btn-excluir { font-size: 17px; }
  .btn-excluir:hover { color: #f87171; }

  /* BARRA DE PROGRESSO */
  .progresso-wrap {
    display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
  }
  .progresso-barra {
    flex: 1; height: 7px; background: #0d0d17;
    border-radius: 10px; overflow: hidden;
  }
  .progresso-fill {
    height: 100%; background: linear-gradient(90deg,#7c3aed,#a855f7);
    border-radius: 10px; transition: width .35s ease;
  }
  .card.completo .progresso-fill { background: linear-gradient(90deg,#16a34a,#22c55e); }
  .progresso-txt {
    font-size: 12px; font-weight: 700; color: #8888b0;
    white-space: nowrap; min-width: 34px; text-align: right;
  }
  .card.completo .progresso-txt { color: #22c55e; }

  /* CANAIS */
  .canais-grupos { display: flex; flex-direction: column; gap: 7px; }
  .grupo-label {
    font-size: 10px; font-weight: 700; color: #5a5a92;
    text-transform: uppercase; letter-spacing: .8px; margin-top: 4px;
  }
  .canais { display: flex; flex-wrap: wrap; gap: 4px; }

  .canal {
    display: flex; align-items: center; gap: 3px;
    padding: 3px 7px; border-radius: 12px;
    border: 1px solid #2a2a44; cursor: pointer;
    transition: all .15s; user-select: none; background: #0d0d17;
  }
  .canal:hover { border-color: #7c3aed; }
  .canal:active { transform: scale(.95); }
  .canal.ok { border-color: #22c55e; background: #0d2818; }

  .canal-nome { font-size: 11px; color: #9090b8; white-space: nowrap; }
  .canal.ok .canal-nome { color: #86efac; font-weight: 600; }
  .check { font-size: 13px; flex-shrink: 0; line-height: 1; }

  /* VAZIO */
  .vazio { text-align: center; padding: 56px 20px; color: #44446a; }
  .vazio-icone { font-size: 52px; margin-bottom: 14px; }
  .vazio p { font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>

<div class="app-titulo">📋 Controle de Post</div>

<div class="header">
  <button class="btn-dia" onclick="mudarDia(-1)">‹</button>
  <div class="dia-info">
    <div class="dia-nome" id="dia-nome"></div>
    <div class="dia-data" id="dia-data"></div>
    <div id="badge-hoje"></div>
  </div>
  <button class="btn-dia" onclick="mudarDia(1)">›</button>
</div>

<div class="resumo" id="resumo"></div>

<div class="acoes-topo">
  <button class="btn-add" onclick="abrirModal()">＋ Adicionar produto</button>
  <button class="btn-imprimir" onclick="imprimir()" title="Imprimir ou salvar em PDF">🖨️ Imprimir / PDF</button>
</div>

<div id="lista"></div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-titulo">Novo produto</h3>
    <label>Nome do produto</label>
    <input type="text" id="inp-nome" placeholder="Ex: Meia calça preta" autocomplete="off">
    <label>Loja de origem</label>
    <select id="inp-loja">
      <option value="">Selecione a loja</option>
      <option value="shopee">Shopee</option>
      <option value="mercadolivre">Mercado Livre</option>
      <option value="shein">Shein</option>
      <option value="amazon">Amazon</option>
      <option value="magalu">Magalu</option>
    </select>
    <div class="modal-btns">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" id="btn-salvar" onclick="salvarProduto()">Adicionar</button>
    </div>
  </div>
</div>

<script>
const PASSOS_LOJA = {
  shopee:        { id: 'vitrine',    nome: 'Vitrine afiliado' },
  mercadolivre:  { id: 'meus_links', nome: 'Meus Links ML' },
  shein:         { id: 'vitrine',    nome: 'Vitrine afiliado' },
  amazon:        { id: 'vitrine',    nome: 'Vitrine afiliado' },
  magalu:        { id: 'vitrine',    nome: 'Vitrine afiliado' },
};

const CANAIS = [
  { id: 'canal_whats',    nome: 'Canal WhatsApp',  grupo: 'Canais' },
  { id: 'canal_telegram', nome: 'Canal Telegram',  grupo: 'Canais' },
  { id: 'story_whats',    nome: 'Story WhatsApp',  grupo: 'Stories' },
  { id: 'story_insta',    nome: 'Story Instagram', grupo: 'Stories' },
  { id: 'story_face',     nome: 'Story Facebook',  grupo: 'Stories' },
  { id: 'reels_insta',    nome: 'Reels Instagram', grupo: 'Reels' },
  { id: 'reels_face',     nome: 'Reels Facebook',  grupo: 'Reels' },
  { id: 'shopee_video',   nome: 'Shopee Vídeo',    grupo: '' },
];

const LOJAS = {
  shopee: 'Shopee', mercadolivre: 'Mercado Livre', shein: 'Shein',
  amazon: 'Amazon', magalu: 'Magalu',
};

const DIAS_SEMANA = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

let offsetDia = 0;
let editandoIndex = null;

function diaAtual() {
  const d = new Date();
  d.setDate(d.getDate() + offsetDia);
  d.setHours(0,0,0,0);
  return d;
}
function chave(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function carregar(k) { return JSON.parse(localStorage.getItem('post_' + k) || '[]'); }
function salvar(k, dados) { localStorage.setItem('post_' + k, JSON.stringify(dados)); }

function itensDoProduto(loja) {
  const passo = PASSOS_LOJA[loja];
  return passo ? [passo, ...CANAIS] : [...CANAIS];
}

function renderDia() {
  const d = diaAtual();
  const k = chave(d);
  const dados = carregar(k);

  document.getElementById('dia-nome').textContent = DIAS_SEMANA[d.getDay()];
  document.getElementById('dia-data').textContent =
    d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();

  const bh = document.getElementById('badge-hoje');
  if (offsetDia === 0) bh.innerHTML = '<span class="badge-hoje">Hoje</span>';
  else bh.innerHTML = '<span class="badge-voltar-hoje" onclick="voltarHoje()">↩ Voltar para hoje</span>';

  // Resumo
  const total = dados.length;
  let feitos = 0, possiveis = 0, completos = 0;
  dados.forEach(p => {
    const itens = itensDoProduto(p.loja);
    const marcados = itens.filter(c => p.canais && p.canais[c.id]).length;
    feitos += marcados;
    possiveis += itens.length;
    if (marcados === itens.length) completos++;
  });

  const resumo = document.getElementById('resumo');
  if (total === 0) {
    resumo.innerHTML = 'Nenhum produto registrado';
  } else if (completos === total) {
    resumo.innerHTML = `<span class="tudo-ok">✅ Tudo postado!</span> ${total} produto${total>1?'s':''} concluído${total>1?'s':''}`;
  } else {
    resumo.innerHTML = `<span>${total}</span> produto${total>1?'s':''} · <span>${feitos}/${possiveis}</span> postagens · <span>${completos}</span> concluído${completos!==1?'s':''}`;
  }

  // Lista
  const lista = document.getElementById('lista');
  if (total === 0) {
    lista.innerHTML = `<div class="vazio">
      <div class="vazio-icone">🛍️</div>
      <p>Nenhum produto ainda.<br>Toque em <b>"+ Adicionar produto"</b> para começar.</p>
    </div>`;
    return;
  }

  lista.innerHTML = dados.map((p, i) => {
    const itens = itensDoProduto(p.loja);
    const marcados = itens.filter(c => p.canais && p.canais[c.id]).length;
    const pct = Math.round(marcados / itens.length * 100);
    const completo = marcados === itens.length;

    let canaisHtml = '';
    let grupoAtual = '\0'; // valor impossível para forçar abertura inicial
    itens.forEach(c => {
      const g = c.grupo || '';
      if (g !== grupoAtual) {
        if (grupoAtual !== '\0') canaisHtml += '</div>';
        if (g) canaisHtml += `<div class="grupo-label">${g}</div>`;
        canaisHtml += '<div class="canais">';
        grupoAtual = g;
      }
      const ok = p.canais && p.canais[c.id];
      canaisHtml += `<div class="canal${ok?' ok':''}" onclick="toggle('${k}',${i},'${c.id}')">
        <span class="canal-nome">${c.nome}</span>
        ${ok?'<span class="check">✅</span>':''}
      </div>`;
    });
    if (grupoAtual !== '\0') canaisHtml += '</div>';

    return `
    <div class="card${completo?' completo':''}">
      <div class="card-top">
        <div class="prod-info">
          <span class="loja-badge loja-${p.loja}">${LOJAS[p.loja]||p.loja}</span>
          <span class="prod-nome">${escapar(p.nome)}</span>
          ${completo?'<span class="selo-completo">✅</span>':''}
        </div>
        <div class="card-acoes">
          <button class="btn-icone btn-editar" onclick="abrirModal('${k}',${i})" title="Editar">✏️</button>
          <button class="btn-icone btn-excluir" onclick="excluir('${k}',${i})" title="Excluir">✕</button>
        </div>
      </div>
      <div class="progresso-wrap">
        <div class="progresso-barra"><div class="progresso-fill" style="width:${pct}%"></div></div>
        <span class="progresso-txt">${marcados}/${itens.length}</span>
      </div>
      <div class="canais-grupos">${canaisHtml}</div>
    </div>`;
  }).join('');
}

function escapar(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function mudarDia(d) { offsetDia += d; renderDia(); }
function voltarHoje() { offsetDia = 0; renderDia(); }

function toggle(k, i, canalId) {
  const dados = carregar(k);
  if (!dados[i].canais) dados[i].canais = {};
  dados[i].canais[canalId] = !dados[i].canais[canalId];
  salvar(k, dados);
  renderDia();
}

function excluir(k, i) {
  const dados = carregar(k);
  if (!confirm('Excluir "' + dados[i].nome + '"?')) return;
  dados.splice(i, 1);
  salvar(k, dados);
  renderDia();
}

function abrirModal(k, i) {
  editandoIndex = (i !== undefined) ? i : null;
  if (editandoIndex !== null) {
    const dados = carregar(k);
    document.getElementById('inp-nome').value = dados[i].nome;
    document.getElementById('inp-loja').value = dados[i].loja;
    document.getElementById('modal-titulo').textContent = 'Editar produto';
    document.getElementById('btn-salvar').textContent = 'Salvar';
  } else {
    document.getElementById('inp-nome').value = '';
    document.getElementById('inp-loja').value = '';
    document.getElementById('modal-titulo').textContent = 'Novo produto';
    document.getElementById('btn-salvar').textContent = 'Adicionar';
  }
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('inp-nome').focus(), 100);
}

function fecharModal() {
  editandoIndex = null;
  document.getElementById('overlay').classList.remove('open');
}

function salvarProduto() {
  const nome = document.getElementById('inp-nome').value.trim();
  const loja = document.getElementById('inp-loja').value;
  if (!nome) { document.getElementById('inp-nome').focus(); return; }
  if (!loja) { document.getElementById('inp-loja').focus(); return; }
  const k = chave(diaAtual());
  const dados = carregar(k);
  if (editandoIndex !== null) {
    dados[editandoIndex].nome = nome;
    dados[editandoIndex].loja = loja;
  } else {
    dados.push({ nome, loja, canais: {} });
  }
  salvar(k, dados);
  fecharModal();
  renderDia();
}

document.getElementById('overlay').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});
document.getElementById('inp-nome').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('inp-loja').focus();
});

// --- IMPRIMIR / PDF: monta uma tabela como o documento original ---
function imprimir() {
  const d = diaAtual();
  const k = chave(d);
  const dados = carregar(k);
  if (dados.length === 0) {
    alert('Nenhum produto para imprimir neste dia.');
    return;
  }
  const dataTxt = DIAS_SEMANA[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();

  // Cabeçalhos: todos os locais possíveis (passo da loja vira coluna "1º passo")
  const colunas = ['1º passo', ...CANAIS.map(c => c.nome)];

  let linhas = '';
  dados.forEach(p => {
    const passo = PASSOS_LOJA[p.loja];
    const can = p.canais || {};
    let tds = '';
    // 1º passo
    tds += `<td class="cel">${passo && can[passo.id] ? '✔' : ''}</td>`;
    // demais canais
    CANAIS.forEach(c => {
      tds += `<td class="cel">${can[c.id] ? '✔' : ''}</td>`;
    });
    linhas += `<tr>
      <td class="loja">${LOJAS[p.loja]||p.loja}</td>
      <td class="prod">${escapar(p.nome)}</td>
      ${tds}
    </tr>`;
  });

  const thead = '<th class="loja">Loja</th><th class="prod">Produto</th>' +
    colunas.map(c => `<th>${c}</th>`).join('');

  const html = `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
  <title>Postagens - ${dataTxt}</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 24px; color: #111; }
    h1 { font-size: 18px; margin: 0 0 2px; }
    .sub { font-size: 13px; color: #555; margin-bottom: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: 11px; }
    th, td { border: 1px solid #999; padding: 5px 6px; text-align: center; }
    th { background: #6d28d9; color: #fff; font-size: 10px; }
    th.loja, th.prod, td.loja, td.prod { text-align: left; }
    td.loja { font-weight: bold; white-space: nowrap; }
    td.prod { min-width: 130px; }
    .cel { font-size: 13px; color: #16a34a; font-weight: bold; }
    tr:nth-child(even) td { background: #f3f0fb; }
    @media print { body { margin: 8px; } }
  </style></head><body>
    <h1>Controle de Postagens</h1>
    <div class="sub">${dataTxt}</div>
    <table>
      <thead><tr>${thead}</tr></thead>
      <tbody>${linhas}</tbody>
    </table>
    <script>window.onload = function(){ window.print(); }<\/script>
  </body></html>`;

  const w = window.open('', '_blank');
  w.document.write(html);
  w.document.close();
}

renderDia();
