<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Controle Financeiro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0d0d17;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 14px 14px 60px;
    max-width: 760px;
    margin: 0 auto;
  }

  .app-titulo {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #60a5fa;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  /* ABAS DE PERFIL */
  .perfil-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .perfil-tab {
    flex: 1; text-align: center; padding: 10px 6px;
    background: #18182c; border: 1px solid #2a2a44; border-radius: 10px;
    color: #8888b0; font-size: 13px; font-weight: 600; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: all .15s;
  }
  .perfil-tab.on {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border-color: transparent; color: #fff;
  }
  .perfil-tab .lapis { font-size: 11px; opacity: .7; margin-left: 4px; }

  /* NAV MÊS/ANO */
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 4px 0 12px;
  }
  .btn-dia {
    background: #20203a;
    border: none;
    color: #b0b0d0;
    font-size: 22px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s, transform .1s;
    flex-shrink: 0;
  }
  .btn-dia:hover { background: #32325a; }
  .btn-dia:active { transform: scale(.92); }
  .dia-info { text-align: center; min-width: 180px; }
  .dia-nome { font-size: 20px; font-weight: 700; color: #fff; text-transform: capitalize; }
  .dia-data { font-size: 12px; color: #7878a8; margin-top: 1px; }

  /* TOGGLE MENSAL/ANUAL */
  .view-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .view-toggle button {
    flex: 1; padding: 9px; background: #18182c; border: 1px solid #2a2a44;
    border-radius: 10px; color: #8888b0; font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .15s;
  }
  .view-toggle button.on { background: #20203a; color: #93c5fd; border-color: #2563eb; }

  /* RESUMO */
  .resumo-mes {
    background: #18182c; border: 1px solid #2a2a44; border-radius: 12px;
    padding: 12px 14px; margin-bottom: 14px; font-size: 13px; color: #9090b8;
    display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; justify-content: space-between;
  }
  .resumo-mes b { color: #fff; font-size: 15px; }
  .resumo-mes .ok { color: #22c55e; font-weight: 700; }
  .resumo-mes .warn { color: #f59e0b; font-weight: 700; }
  .resumo-mes b.ok { color: #22c55e; }
  .resumo-mes b.neg { color: #f87171; }
  .resumo-mes .copiar {
    background: none; border: 1px solid #3a3a5a; border-radius: 8px;
    color: #60a5fa; font-size: 11px; padding: 5px 9px; cursor: pointer;
  }

  /* CARDS DE GRUPO */
  .card {
    background: #18182c; border-radius: 16px; padding: 14px;
    margin-bottom: 12px; border: 1px solid #2a2a44;
  }
  .grupo-top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; gap: 8px;
  }
  .grupo-nome { font-size: 15px; font-weight: 700; color: #fff; cursor: pointer; }
  .card.receita { border-color: #16a34a; }
  .tag-receita {
    font-size: 10px; font-weight: 700; color: #6ee7a7; background: #123321;
    border: 1px solid #16a34a; padding: 2px 7px; border-radius: 8px; margin-left: 6px;
    text-transform: uppercase; letter-spacing: .4px;
  }
  .btn-add.receita {
    background: linear-gradient(135deg, #16a34a, #22c55e);
    box-shadow: 0 4px 14px rgba(22,163,74,.35);
  }
  .grupos-add-row { display: flex; gap: 8px; }
  .grupos-add-row .btn-add { margin-bottom: 14px; }
  .btn-icone {
    background: none; border: none; color: #55557a;
    font-size: 15px; cursor: pointer; padding: 5px 7px;
    border-radius: 8px; transition: color .2s, background .2s;
  }
  .btn-icone:hover { background: #20203a; color: #f87171; }

  .item-row {
    background: #14142a; border: 1px solid #22223e; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .item-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
  .item-nome { font-size: 14px; font-weight: 600; color: #e0e0e0; cursor: pointer; word-break: break-word; }
  .item-campos { display: flex; gap: 8px; margin-bottom: 8px; }
  .item-campos input {
    background: #0d0d17; border: 1px solid #2a2a44; border-radius: 8px;
    color: #e0e0e0; font-size: 13px; padding: 8px 10px; outline: none;
  }
  .item-campos input:focus { border-color: #2563eb; }
  .inp-valor { flex: 1; min-width: 0; font-weight: 700; }
  .inp-nota { width: 90px; flex-shrink: 0; }

  .status-chips { display: flex; gap: 6px; }
  .status-chip {
    flex: 1; text-align: center; font-size: 11px; font-weight: 700;
    padding: 6px 4px; border-radius: 8px; border: 1px solid #2a2a44;
    background: #0d0d17; color: #5a5a92; cursor: pointer; user-select: none;
    transition: all .15s;
  }
  .status-chip.pago.on { background: #16341f; border-color: #22c55e; color: #6ee7a7; }
  .status-chip.pendente.on { background: #3a2a0d; border-color: #f59e0b; color: #fbbf24; }
  .status-chip.na.on { background: #2a2a3a; border-color: #5a5a7a; color: #a0a0c0; }

  .btn-add-mini {
    width: 100%; padding: 8px; background: none; border: 1px dashed #3a3a5a;
    border-radius: 8px; color: #8888b0; font-size: 12px; cursor: pointer; margin-top: 2px;
  }
  .btn-add-mini:hover { background: #14142a; }
  .grupo-subtotal {
    text-align: right; font-size: 12px; color: #7878a8; margin-top: 10px;
    padding-top: 8px; border-top: 1px solid #22223e;
  }
  .grupo-subtotal b { color: #93c5fd; }

  .btn-add {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 10px;
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border: none; border-radius: 10px;
    color: #fff; font-size: 13px; font-weight: 700;
    cursor: pointer; margin-bottom: 14px;
    transition: filter .2s, transform .1s;
    box-shadow: 0 4px 14px rgba(37,99,235,.35);
  }
  .btn-add:hover { filter: brightness(1.1); }
  .btn-add:active { transform: scale(.98); }

  /* CONTAS / SALDO */
  .conta-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  }
  .conta-row input.inp-conta-nome {
    flex: 1; background: #14142a; border: 1px solid #22223e; border-radius: 8px;
    color: #e0e0e0; font-size: 13px; padding: 8px 10px; outline: none; min-width: 0;
  }
  .conta-row input.inp-conta-saldo {
    width: 110px; background: #14142a; border: 1px solid #22223e; border-radius: 8px;
    color: #6ee7a7; font-weight: 700; font-size: 13px; padding: 8px 10px; outline: none; flex-shrink: 0;
  }
  .conta-row input:focus { border-color: #2563eb; }
  .conta-total { text-align: right; font-size: 13px; color: #9090b8; margin-top: 4px; }
  .conta-total b { color: #6ee7a7; font-size: 15px; }

  /* VAZIO */
  .vazio { text-align: center; padding: 40px 20px; color: #44446a; }
  .vazio-icone { font-size: 44px; margin-bottom: 12px; }
  .vazio p { font-size: 14px; line-height: 1.5; }

  /* VISÃO ANUAL */
  .anual-grupo { margin-bottom: 16px; }
  .anual-grupo .grupo-nome { margin-bottom: 8px; display: block; }
  .tabela-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid #2a2a44; }
  table.tabela-anual { border-collapse: collapse; width: 100%; font-size: 11px; white-space: nowrap; }
  table.tabela-anual th, table.tabela-anual td {
    padding: 7px 8px; text-align: center; border-bottom: 1px solid #22223e; border-right: 1px solid #22223e;
  }
  table.tabela-anual th { background: #20203a; color: #60a5fa; font-size: 10px; text-transform: uppercase; }
  table.tabela-anual td.col-nome, table.tabela-anual th.col-nome {
    text-align: left; position: sticky; left: 0; background: #18182c; z-index: 1;
    max-width: 110px; overflow: hidden; text-overflow: ellipsis; font-weight: 600;
  }
  table.tabela-anual th.col-nome { background: #20203a; }
  table.tabela-anual tr.linha-subtotal td { background: #142238; font-weight: 700; color: #93c5fd; }
  table.tabela-anual tr.linha-subtotal td.col-nome { background: #142238; }
  .cel-pago { color: #6ee7a7; }
  .cel-pendente { color: #fbbf24; }
  .cel-na { color: #4a4a6a; }
  .cel-vazio { color: #2e2e48; }
  .anual-total {
    background: #18182c; border: 1px solid #2a2a44; border-radius: 12px;
    padding: 14px; margin-top: 4px; font-size: 13px; color: #9090b8;
  }
  .anual-total .linha { display: flex; justify-content: space-between; padding: 4px 0; }
  .anual-total b { color: #fff; }
  .anual-total b.ok { color: #22c55e; }
  .anual-total b.neg { color: #f87171; }
  .anual-total .total-geral b { color: #93c5fd; font-size: 17px; }
  .anual-total .total-geral b.ok { color: #22c55e; }
  .anual-total .total-geral b.neg { color: #f87171; }

  /* RODAPÉ */
  .rodape {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 18px; padding-top: 14px; border-top: 1px solid #20203a;
  }
  .rodape-btn {
    background: transparent; border: none; color: #8888b0;
    font-size: 13px; padding: 6px 10px; cursor: pointer; border-radius: 8px;
  }
  .rodape-btn:hover { background: #18182c; color: #93c5fd; }
</style>
</head>
<body>

<div class="app-titulo">Controle Financeiro</div>

<div class="perfil-tabs" id="perfil-tabs"></div>

<div class="view-toggle" id="view-toggle">
  <button id="btn-view-mensal" onclick="mudarView('mensal')">📅 Mensal</button>
  <button id="btn-view-anual" onclick="mudarView('anual')">📊 Anual</button>
</div>

<div class="header">
  <button class="btn-dia" onclick="mudarPeriodo(-1)">‹</button>
  <div class="dia-info">
    <div class="dia-nome" id="periodo-nome"></div>
    <div class="dia-data" id="periodo-sub"></div>
  </div>
  <button class="btn-dia" onclick="mudarPeriodo(1)">›</button>
</div>

<div id="conteudo"></div>

<div class="rodape">
  <button class="rodape-btn" onclick="fazerBackup()">💾 Backup</button>
  <button class="rodape-btn" onclick="document.getElementById('inp-restaurar').click()">⬆️ Restaurar</button>
  <input type="file" id="inp-restaurar" accept=".json" style="display:none" onchange="restaurarBackup(this)">
</div>

<script>
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// ============ PERFIS ============
function carregarPerfis() {
  let perfis = JSON.parse(localStorage.getItem('fin_perfis') || 'null');
  if (!perfis) {
    perfis = [
      { id: 'p1', nome: 'Nina' },
      { id: 'p2', nome: 'Raquel' },
      { id: 'p3', nome: 'Perfil 3' },
    ];
    localStorage.setItem('fin_perfis', JSON.stringify(perfis));
  }
  return perfis;
}
function salvarPerfis(perfis) {
  localStorage.setItem('fin_perfis', JSON.stringify(perfis));
}

// ============ ESTADO DE NAVEGAÇÃO ============
function carregarUI() {
  const agora = new Date();
  const padrao = { perfilAtivo: 'p1', ano: agora.getFullYear(), mes: agora.getMonth(), view: 'mensal' };
  const ui = JSON.parse(localStorage.getItem('fin_ui') || 'null');
  return ui ? Object.assign(padrao, ui) : padrao;
}
let UI = carregarUI();
function salvarUI() { localStorage.setItem('fin_ui', JSON.stringify(UI)); }

// ============ DADOS DO PERFIL ============
function carregarDados(perfilId) {
  const d = JSON.parse(localStorage.getItem('fin_dados_' + perfilId) || 'null');
  return d || { grupos: [], contas: [] };
}
function salvarDados(perfilId, dados) {
  localStorage.setItem('fin_dados_' + perfilId, JSON.stringify(dados));
}
function dadosAtuais() { return carregarDados(UI.perfilAtivo); }

function mesChave(ano, mes) {
  return ano + '-' + String(mes + 1).padStart(2, '0');
}

// ============ FORMATAÇÃO ============
function formatarMoeda(v) {
  v = Number(v) || 0;
  return 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function parseValor(s) {
  if (!s) return 0;
  s = String(s).trim().replace(/[^\d,.-]/g, '');
  if (!s) return 0;
  if (s.includes(',') && s.includes('.')) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (s.includes(',')) {
    s = s.replace(',', '.');
  }
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function escapar(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// ============ RENDER GERAL ============
function render() {
  renderAbasPerfil();
  document.getElementById('btn-view-mensal').classList.toggle('on', UI.view === 'mensal');
  document.getElementById('btn-view-anual').classList.toggle('on', UI.view === 'anual');

  if (UI.view === 'mensal') {
    document.getElementById('periodo-nome').textContent = MESES[UI.mes];
    document.getElementById('periodo-sub').textContent = String(UI.ano);
    renderMensal();
  } else {
    document.getElementById('periodo-nome').textContent = String(UI.ano);
    document.getElementById('periodo-sub').textContent = 'visão anual';
    renderAnual();
  }
}

function renderAbasPerfil() {
  const perfis = carregarPerfis();
  const cont = document.getElementById('perfil-tabs');
  cont.innerHTML = perfis.map(p => `
    <div class="perfil-tab${p.id === UI.perfilAtivo ? ' on' : ''}" onclick="selecionarPerfil('${p.id}')" ondblclick="renomearPerfil('${p.id}')">
      ${escapar(p.nome)}<span class="lapis" onclick="event.stopPropagation();renomearPerfil('${p.id}')">✏️</span>
    </div>`).join('');
}
function selecionarPerfil(id) { UI.perfilAtivo = id; salvarUI(); render(); }
function renomearPerfil(id) {
  const perfis = carregarPerfis();
  const p = perfis.find(x => x.id === id);
  if (!p) return;
  const novo = prompt('Nome do perfil:', p.nome);
  if (novo === null) return;
  const t = novo.trim();
  if (!t) return;
  p.nome = t;
  salvarPerfis(perfis);
  render();
}

function mudarView(v) { UI.view = v; salvarUI(); render(); }
function mudarPeriodo(delta) {
  if (UI.view === 'mensal') {
    UI.mes += delta;
    if (UI.mes < 0) { UI.mes = 11; UI.ano--; }
    if (UI.mes > 11) { UI.mes = 0; UI.ano++; }
  } else {
    UI.ano += delta;
  }
  salvarUI();
  render();
}

// ============ VISÃO MENSAL ============
function tipoGrupo(g) { return g.tipo === 'receita' ? 'receita' : 'despesa'; }

function totaisMes(dados, ano, mes) {
  const k = mesChave(ano, mes);
  let despesaTotal = 0, pago = 0, pendente = 0, receitaTotal = 0;
  dados.grupos.forEach(g => {
    const tipo = tipoGrupo(g);
    g.itens.forEach(it => {
      const c = it.meses && it.meses[k];
      if (!c || c.status === 'na') return;
      const v = Number(c.valor) || 0;
      if (tipo === 'receita') {
        receitaTotal += v;
      } else {
        despesaTotal += v;
        if (c.status === 'pago') pago += v;
        else pendente += v;
      }
    });
  });
  return { despesaTotal, pago, pendente, receitaTotal, saldo: receitaTotal - despesaTotal };
}

const ROTULOS_STATUS = {
  despesa: { pago: '✓ Pago', pendente: '? Pendente', na: '✕ N/A' },
  receita: { pago: '✓ Recebido', pendente: '? A receber', na: '✕ N/A' },
};

function renderMensal() {
  const dados = dadosAtuais();
  const k = mesChave(UI.ano, UI.mes);
  const t = totaisMes(dados, UI.ano, UI.mes);
  const saldoClasse = t.saldo >= 0 ? 'ok' : 'neg';

  let html = `<div class="resumo-mes">
    <span>Receitas: <b class="ok">${formatarMoeda(t.receitaTotal)}</b> · Despesas: <b>${formatarMoeda(t.despesaTotal)}</b></span>
    <span>Pago: <span class="ok">${formatarMoeda(t.pago)}</span> · Pendente: <span class="warn">${formatarMoeda(t.pendente)}</span></span>
    <span>Saldo do mês: <b class="${saldoClasse}">${formatarMoeda(t.saldo)}</b></span>
    <button class="copiar" onclick="copiarMesAnterior()">📋 Copiar valores do mês anterior</button>
  </div>`;

  if (dados.grupos.length === 0) {
    html += `<div class="vazio">
      <div class="vazio-icone">💰</div>
      <p>Nenhum grupo ainda.<br>Toque em <b>"+ Grupo de despesas"</b> ou <b>"+ Grupo de receitas"</b> para começar a lançar as contas deste perfil.</p>
    </div>`;
  } else {
    dados.grupos.forEach(g => {
      const tipo = tipoGrupo(g);
      const rotulos = ROTULOS_STATUS[tipo];
      let subtotal = 0;
      const itensHtml = g.itens.map(it => {
        const c = (it.meses && it.meses[k]) || { valor: '', status: '', nota: '' };
        if (c.status !== 'na') subtotal += Number(c.valor) || 0;
        const valorStr = c.valor === '' || c.valor === undefined || c.valor === null ? '' : String(c.valor).replace('.', ',');
        return `
        <div class="item-row">
          <div class="item-top">
            <span class="item-nome" onclick="renomearItem('${g.id}','${it.id}')">${escapar(it.nome)}</span>
            <button class="btn-icone" onclick="excluirItem('${g.id}','${it.id}')" title="Excluir">🗑</button>
          </div>
          <div class="item-campos">
            <input type="text" inputmode="decimal" class="inp-valor" placeholder="0,00" value="${escapar(valorStr)}"
              onchange="salvarValor('${g.id}','${it.id}', this.value)">
            <input type="text" class="inp-nota" placeholder="parcela" value="${escapar(c.nota || '')}"
              onchange="salvarNota('${g.id}','${it.id}', this.value)">
          </div>
          <div class="status-chips">
            <span class="status-chip pago${c.status === 'pago' ? ' on' : ''}" onclick="definirStatus('${g.id}','${it.id}','pago')">${rotulos.pago}</span>
            <span class="status-chip pendente${c.status === 'pendente' ? ' on' : ''}" onclick="definirStatus('${g.id}','${it.id}','pendente')">${rotulos.pendente}</span>
            <span class="status-chip na${c.status === 'na' ? ' on' : ''}" onclick="definirStatus('${g.id}','${it.id}','na')">${rotulos.na}</span>
          </div>
        </div>`;
      }).join('');

      html += `<div class="card${tipo === 'receita' ? ' receita' : ''}">
        <div class="grupo-top">
          <span class="grupo-nome" onclick="renomearGrupo('${g.id}')">${escapar(g.nome)}${tipo === 'receita' ? '<span class="tag-receita">Receita</span>' : ''}</span>
          <button class="btn-icone" onclick="excluirGrupo('${g.id}')" title="Excluir grupo">🗑</button>
        </div>
        ${itensHtml}
        <button class="btn-add-mini" onclick="adicionarItem('${g.id}')">+ Item</button>
        <div class="grupo-subtotal">Subtotal do mês: <b>${formatarMoeda(subtotal)}</b></div>
      </div>`;
    });
  }

  html += `<div class="grupos-add-row">
    <button class="btn-add" onclick="adicionarGrupo('despesa')">＋ Grupo de despesas</button>
    <button class="btn-add receita" onclick="adicionarGrupo('receita')">＋ Grupo de receitas</button>
  </div>`;

  // Saldo em contas
  let totalContas = 0;
  const contasHtml = (dados.contas || []).map(c => {
    totalContas += Number(c.saldo) || 0;
    const saldoStr = c.saldo === '' || c.saldo === undefined || c.saldo === null ? '' : String(c.saldo).replace('.', ',');
    return `<div class="conta-row">
      <input class="inp-conta-nome" value="${escapar(c.nome)}" placeholder="Nome da conta" onchange="salvarContaNome('${c.id}', this.value)">
      <input class="inp-conta-saldo" type="text" inputmode="decimal" value="${escapar(saldoStr)}" placeholder="0,00" onchange="salvarContaSaldo('${c.id}', this.value)">
      <button class="btn-icone" onclick="excluirConta('${c.id}')">🗑</button>
    </div>`;
  }).join('');

  html += `<div class="card">
    <div class="grupo-top"><span class="grupo-nome">💰 Saldo em contas</span></div>
    ${contasHtml || '<p style="font-size:12px;color:#5a5a92;margin-bottom:8px">Nenhuma conta cadastrada.</p>'}
    <button class="btn-add-mini" onclick="adicionarConta()">+ Conta</button>
    <div class="conta-total">Total disponível: <b>${formatarMoeda(totalContas)}</b></div>
  </div>`;

  document.getElementById('conteudo').innerHTML = html;
}

function copiarMesAnterior() {
  const dados = dadosAtuais();
  let anoAnt = UI.ano, mesAnt = UI.mes - 1;
  if (mesAnt < 0) { mesAnt = 11; anoAnt--; }
  const kAtual = mesChave(UI.ano, UI.mes);
  const kAnt = mesChave(anoAnt, mesAnt);
  let copiou = 0;
  dados.grupos.forEach(g => g.itens.forEach(it => {
    if (!it.meses) it.meses = {};
    const anterior = it.meses[kAnt];
    const atual = it.meses[kAtual];
    if (anterior && (!atual || (!atual.valor && atual.valor !== 0))) {
      it.meses[kAtual] = { valor: anterior.valor, status: 'pendente', nota: anterior.nota || '' };
      copiou++;
    }
  }));
  if (copiou === 0) { alert('Não há valores do mês anterior para copiar (ou este mês já está preenchido).'); return; }
  salvarDados(UI.perfilAtivo, dados);
  render();
}

// ---- ações de grupo/item ----
function adicionarGrupo(tipo) {
  tipo = tipo === 'receita' ? 'receita' : 'despesa';
  const exemplo = tipo === 'receita' ? 'Salário, MEX, INSS' : 'Contas fixas, Cartões, Empréstimos';
  const nome = prompt('Nome do grupo de ' + tipo + ' (ex: ' + exemplo + '):');
  if (!nome || !nome.trim()) return;
  const dados = dadosAtuais();
  dados.grupos.push({ id: uid(), nome: nome.trim(), tipo, itens: [] });
  salvarDados(UI.perfilAtivo, dados);
  render();
}
function renomearGrupo(gid) {
  const dados = dadosAtuais();
  const g = dados.grupos.find(x => x.id === gid);
  if (!g) return;
  const novo = prompt('Nome do grupo:', g.nome);
  if (novo === null || !novo.trim()) return;
  g.nome = novo.trim();
  salvarDados(UI.perfilAtivo, dados);
  render();
}
function excluirGrupo(gid) {
  const dados = dadosAtuais();
  const g = dados.grupos.find(x => x.id === gid);
  if (!g) return;
  if (!confirm('Excluir o grupo "' + g.nome + '" e todos os itens dele?')) return;
  dados.grupos = dados.grupos.filter(x => x.id !== gid);
  salvarDados(UI.perfilAtivo, dados);
  render();
}
function adicionarItem(gid) {
  const nome = prompt('Nome da conta/item (ex: Aluguel, Luz, Cartão Nubank):');
  if (!nome || !nome.trim()) return;
  const dados = dadosAtuais();
  const g = dados.grupos.find(x => x.id === gid);
  if (!g) return;
  g.itens.push({ id: uid(), nome: nome.trim(), meses: {} });
  salvarDados(UI.perfilAtivo, dados);
  render();
}
function renomearItem(gid, iid) {
  const dados = dadosAtuais();
  const g = dados.grupos.find(x => x.id === gid);
  const it = g && g.itens.find(x => x.id === iid);
  if (!it) return;
  const novo = prompt('Nome da conta/item:', it.nome);
  if (novo === null || !novo.trim()) return;
  it.nome = novo.trim();
  salvarDados(UI.perfilAtivo, dados);
  render();
}
function excluirItem(gid, iid) {
  const dados = dadosAtuais();
  const g = dados.grupos.find(x => x.id === gid);
  if (!g) return;
  const it = g.itens.find(x => x.id === iid);
  if (!it) return;
  if (!confirm('Excluir "' + it.nome + '"?')) return;
  g.itens = g.itens.filter(x => x.id !== iid);
  salvarDados(UI.perfilAtivo, dados);
  render();
}
function celulaDoItem(dados, gid, iid) {
  const g = dados.grupos.find(x => x.id === gid);
  const it = g && g.itens.find(x => x.id === iid);
  if (!it) return null;
  if (!it.meses) it.meses = {};
  const k = mesChave(UI.ano, UI.mes);
  if (!it.meses[k]) it.meses[k] = { valor: '', status: '', nota: '' };
  return it.meses[k];
}
function salvarValor(gid, iid, valorTxt) {
  const dados = dadosAtuais();
  const c = celulaDoItem(dados, gid, iid);
  if (!c) return;
  c.valor = valorTxt.trim() === '' ? '' : parseValor(valorTxt);
  if (c.valor !== '' && !c.status) c.status = 'pendente';
  salvarDados(UI.perfilAtivo, dados);
  render();
}
function salvarNota(gid, iid, notaTxt) {
  const dados = dadosAtuais();
  const c = celulaDoItem(dados, gid, iid);
  if (!c) return;
  c.nota = notaTxt.trim();
  salvarDados(UI.perfilAtivo, dados);
}
function definirStatus(gid, iid, status) {
  const dados = dadosAtuais();
  const c = celulaDoItem(dados, gid, iid);
  if (!c) return;
  c.status = (c.status === status) ? '' : status;
  salvarDados(UI.perfilAtivo, dados);
  render();
}

// ---- contas / saldo ----
function adicionarConta() {
  const nome = prompt('Nome da conta (ex: Banco, Cartão):');
  if (!nome || !nome.trim()) return;
  const dados = dadosAtuais();
  if (!dados.contas) dados.contas = [];
  dados.contas.push({ id: uid(), nome: nome.trim(), saldo: '' });
  salvarDados(UI.perfilAtivo, dados);
  render();
}
function salvarContaNome(cid, nome) {
  const dados = dadosAtuais();
  const c = (dados.contas || []).find(x => x.id === cid);
  if (!c) return;
  c.nome = nome.trim() || c.nome;
  salvarDados(UI.perfilAtivo, dados);
}
function salvarContaSaldo(cid, saldoTxt) {
  const dados = dadosAtuais();
  const c = (dados.contas || []).find(x => x.id === cid);
  if (!c) return;
  c.saldo = saldoTxt.trim() === '' ? '' : parseValor(saldoTxt);
  salvarDados(UI.perfilAtivo, dados);
  render();
}
function excluirConta(cid) {
  const dados = dadosAtuais();
  if (!confirm('Excluir esta conta?')) return;
  dados.contas = (dados.contas || []).filter(x => x.id !== cid);
  salvarDados(UI.perfilAtivo, dados);
  render();
}

// ============ VISÃO ANUAL ============
function renderAnual() {
  const dados = dadosAtuais();
  let html = '';

  if (dados.grupos.length === 0) {
    html += `<div class="vazio">
      <div class="vazio-icone">📊</div>
      <p>Nenhum grupo ainda.<br>Cadastre contas na visão <b>Mensal</b> primeiro.</p>
    </div>`;
    document.getElementById('conteudo').innerHTML = html;
    return;
  }

  const despesaMes = new Array(12).fill(0);
  const receitaMes = new Array(12).fill(0);

  dados.grupos.forEach(g => {
    const tipo = tipoGrupo(g);
    const subtotalMes = new Array(12).fill(0);
    let linhas = '';
    g.itens.forEach(it => {
      let cels = '';
      for (let m = 0; m < 12; m++) {
        const k = mesChave(UI.ano, m);
        const c = it.meses && it.meses[k];
        if (!c || c.valor === '' || c.valor === undefined || c.valor === null) {
          cels += `<td class="cel-vazio">—</td>`;
        } else {
          const v = Number(c.valor) || 0;
          subtotalMes[m] += (c.status !== 'na') ? v : 0;
          const classe = c.status === 'pago' ? 'cel-pago' : (c.status === 'na' ? 'cel-na' : 'cel-pendente');
          cels += `<td class="${classe}">${v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>`;
        }
      }
      linhas += `<tr><td class="col-nome">${escapar(it.nome)}</td>${cels}</tr>`;
    });
    for (let m = 0; m < 12; m++) {
      if (tipo === 'receita') receitaMes[m] += subtotalMes[m];
      else despesaMes[m] += subtotalMes[m];
    }
    const subtotalCels = subtotalMes.map(v => `<td>${formatarMoeda(v)}</td>`).join('');
    linhas += `<tr class="linha-subtotal"><td class="col-nome">Subtotal</td>${subtotalCels}</tr>`;

    const cabecMeses = MESES_ABREV.map(m => `<th>${m}</th>`).join('');
    html += `<div class="anual-grupo">
      <span class="grupo-nome">${escapar(g.nome)}${tipo === 'receita' ? '<span class="tag-receita">Receita</span>' : ''}</span>
      <div class="tabela-wrap">
        <table class="tabela-anual">
          <thead><tr><th class="col-nome">Item</th>${cabecMeses}</tr></thead>
          <tbody>${linhas}</tbody>
        </table>
      </div>
    </div>`;
  });

  const receitaAno = receitaMes.reduce((a, b) => a + b, 0);
  const despesaAno = despesaMes.reduce((a, b) => a + b, 0);
  const saldoAno = receitaAno - despesaAno;
  const linhasResumo = MESES_ABREV.map((m, i) => {
    const saldoMes = receitaMes[i] - despesaMes[i];
    return `<div class="linha"><span>${m}</span><b class="${saldoMes >= 0 ? 'ok' : 'neg'}">${formatarMoeda(saldoMes)}</b></div>`;
  }).join('');

  html += `<div class="anual-total">
    ${linhasResumo}
    <div class="linha" style="border-top:1px solid #2a2a44;margin-top:6px;padding-top:10px">
      <span>Total de receitas</span><b class="ok">${formatarMoeda(receitaAno)}</b>
    </div>
    <div class="linha"><span>Total de despesas</span><b>${formatarMoeda(despesaAno)}</b></div>
    <div class="linha total-geral">
      <span>Saldo do ano</span><b class="${saldoAno >= 0 ? 'ok' : 'neg'}">${formatarMoeda(saldoAno)}</b>
    </div>
  </div>`;

  document.getElementById('conteudo').innerHTML = html;
}

// ============ BACKUP / RESTAURAR ============
function fazerBackup() {
  const tudo = {};
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k.startsWith('fin_')) tudo[k] = localStorage.getItem(k);
  }
  const blob = new Blob([JSON.stringify(tudo)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const hoje = new Date();
  const nome = 'backup-financas-' + hoje.getFullYear() + '-' + String(hoje.getMonth() + 1).padStart(2, '0') + '-' + String(hoje.getDate()).padStart(2, '0') + '.json';
  const a = document.createElement('a');
  a.href = url; a.download = nome; a.click();
  URL.revokeObjectURL(url);
  alert('💾 Backup salvo no seu aparelho: ' + nome + '\nGuarde esse arquivo em local seguro.');
}
function restaurarBackup(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const tudo = JSON.parse(e.target.result);
      if (!confirm('Restaurar este backup? Os dados financeiros atuais serão substituídos pelos do arquivo.')) return;
      Object.keys(localStorage).forEach(k => { if (k.startsWith('fin_')) localStorage.removeItem(k); });
      Object.keys(tudo).forEach(k => localStorage.setItem(k, tudo[k]));
      UI = carregarUI();
      alert('✅ Backup restaurado com sucesso!');
      render();
    } catch (err) { alert('Arquivo inválido. Use um backup gerado por este app.'); }
  };
  reader.readAsText(file);
  input.value = '';
}

render();

// Registra o service worker (funcionar offline no celular)
if ('serviceWorker' in navigator) {
  let recarregando = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (recarregando) return;
    recarregando = true;
    window.location.reload();
  });
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const novo = reg.installing;
      if (!novo) return;
      novo.addEventListener('statechange', () => {
        if (novo.state === 'installed' && navigator.serviceWorker.controller) {
          novo.postMessage('skipWaiting');
        }
      });
    });
    setInterval(() => reg.update().catch(() => {}), 60000);
  }).catch(() => {});
}
